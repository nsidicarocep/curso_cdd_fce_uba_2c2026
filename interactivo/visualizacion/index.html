<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller de Visualización WDI</title>
<style>
/* Layout: controles a la izquierda, gráfico al centro (título, gráfico, leyenda, fuente) y avisos debajo del gráfico; ficha a la derecha. */
:root{
  --paper:#f4f5f7; --surface:#ffffff; --surface-2:#f0f1f3; --ink:#1a1a1a; --ink-2:#4d4d4d;
  --muted:#7f7f7f; --rule:#e3e4e6; --grid:#ebebeb; --axis:#bdbdbd;
  --accent:#3d6b9e; --accent-soft:#e6eef7; --hi:#d15573;
  --warn-bg:#fdf6e7; --warn-ink:#6b5310; --warn-rule:#ecd9a6;
  --tip-bg:#1a1a1a; --tip-ink:#ffffff;
  --radius:4px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#121417; --surface:#1b1e22; --surface-2:#24282d; --ink:#eef0f2; --ink-2:#c2c6cb;
  --muted:#8e949a; --rule:#2e3338; --grid:#2a2e33; --axis:#4a5057;
  --accent:#9cccd8; --accent-soft:#1f3340; --hi:#f7afb3;
  --warn-bg:#2b2616; --warn-ink:#e8d39a; --warn-rule:#57491f;
  --tip-bg:#eef0f2; --tip-ink:#121417;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── cabecera ── */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding-block:12px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;flex:1;min-width:0}
h1{font-weight:700;font-size:18px;margin:0;letter-spacing:-.005em;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin:0}
.themebtn{display:inline-flex;gap:0;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--surface-2)}
.themebtn button{font:500 12px/1 var(--sans);color:var(--ink-2);background:none;border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
.themebtn button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
nav.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
nav.tabs button{font:500 13px/1 var(--sans);color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── explorar: grilla ── */
.explore{display:grid;grid-template-columns:270px minmax(0,1fr) 250px;gap:20px;padding-block:18px 40px;align-items:start}
@media (max-width:1180px){.explore{grid-template-columns:260px minmax(0,1fr)}.notecol{grid-column:1/-1}}
@media (max-width:760px){.explore{grid-template-columns:minmax(0,1fr)}}
.maincol{display:flex;flex-direction:column;gap:12px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px}
.panel h2,.note h2{font:700 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
fieldset{border:0;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:9px}
fieldset+fieldset{border-top:1px solid var(--rule);padding-top:13px}
legend{font:700 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 0 8px}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.ctl select,.ctl input[type=range]{width:100%}
select{font:400 12.5px/1.3 var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--rule);border-radius:var(--radius);padding:5px 6px}
select[multiple]{padding:2px;font-size:12px}
select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rangerow{display:flex;align-items:center;gap:8px}
.rangerow output{font:600 12px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--accent);min-width:3.1em;text-align:right}
input[type=range]{accent-color:var(--accent);height:16px}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
.hidden{display:none!important}

/* ── lienzo: título, subtítulo, gráfico, leyenda, fuente ── */
.canvasbox{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 18px 14px;min-width:0}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:6px 14px}
.ctitle{font-size:17px;font-weight:700;line-height:1.3;margin:0;color:var(--ink);text-wrap:balance}
.csub{color:var(--ink-2);font-size:13px;margin:3px 0 0;opacity:.85}
.cfam{font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:999px;white-space:nowrap}
.plot{position:relative;margin-top:14px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
text{font-family:var(--sans);fill:var(--ink-2);font-variant-numeric:tabular-nums}
.tick text{font-size:10.5px;fill:var(--muted)}
.axlabel{font-family:var(--sans);font-size:11.5px;font-weight:400;fill:var(--ink-2)}
.gridline{stroke:var(--grid);stroke-width:1}
.axisline{stroke:var(--axis);stroke-width:1}
.dlabel{font-family:var(--sans);font-size:10px;fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.mark{transition:opacity .12s}
#legend:empty{display:none}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 16px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:2px;flex:none}
.rampbox{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.ramp{height:10px;flex:1 1 140px;max-width:260px;border-radius:2px}
.foot{margin:12px 0 0;font-size:11px;color:var(--muted);line-height:1.45;text-align:right}
.foot b{font-weight:600;color:var(--ink-2)}
.foot span{display:block}

/* ── small multiples ── */
.facets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 16px;margin-top:2px}
.facet{min-width:0}
.ftitle{font:700 12px/1.3 var(--sans);margin:0 0 2px;color:var(--ink);text-wrap:balance}
.fbody{min-width:0}
.fbody .loading{padding:28px 6px;font-size:11px}
@media (max-width:520px){.facets{grid-template-columns:minmax(0,1fr)}}

/* ── avisos, fuera del gráfico ── */
.warns{display:flex;flex-direction:column;gap:6px}
.warns:empty{display:none}
.warnhead{font:700 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 2px}
.warn{display:flex;gap:8px;font-size:12px;line-height:1.45;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-rule);border-radius:var(--radius);padding:8px 10px}
.warn .ic{flex:none;font-weight:700}

/* ── ficha lateral ── */
.notecol{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px)}
@media (max-width:1180px){.notecol{position:static}}
.note{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px}
.note dl{margin:0;display:flex;flex-direction:column;gap:11px}
.note dt{font:700 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.note dd{margin:0;font-size:12.3px;line-height:1.5;color:var(--ink-2)}

/* ── tooltip ── */
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);font:400 11.5px/1.45 var(--sans);padding:6px 9px;border-radius:var(--radius);max-width:260px;opacity:0;transition:opacity .1s;white-space:pre-line}
#tip.on{opacity:1}

/* ── metodología ── */
.meth{padding-block:22px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:30px}
.meth .lede{font-size:15px;line-height:1.65;color:var(--ink-2);max-width:68ch}
.meth h2{font-size:20px;font-weight:700;margin:0 0 6px}
.meth h3{font:700 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px}
.card h4{font-size:15px;font-weight:700;margin:0 0 9px}
.card dl{margin:0;display:flex;flex-direction:column;gap:9px}
.card dt{font:700 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.card dd{margin:0;font-size:12.3px;line-height:1.5;color:var(--ink-2)}
.caveats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.cav{background:var(--surface);padding:12px 13px}
.cav b{display:block;font-size:12.5px;margin-bottom:4px}
.cav p{margin:0;font-size:12px;line-height:1.5;color:var(--ink-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font:700 10.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
td{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
td.t{color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right}
a{color:var(--accent)}
code{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:.92em}
.btn{font:500 12px/1 var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--rule);border-radius:var(--radius);padding:7px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.datahead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;padding-block:20px 12px}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="topin">
    <div class="brand">
      <h1>Taller de Visualización WDI</h1>
      <p class="sub">Indicadores del Desarrollo Mundial (Banco Mundial) · 172 países · 1990–2023</p>
    </div>
    <div class="themebtn" role="group" aria-label="Tema de color">
      <button type="button" id="th-light" aria-pressed="true">Claro</button>
      <button type="button" id="th-dark" aria-pressed="false">Oscuro</button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-explorar" aria-selected="true">Explorar</button>
    <button role="tab" id="tab-metodologia" aria-selected="false">Metodología</button>
    <button role="tab" id="tab-datos" aria-selected="false">Datos del gráfico</button>
    <button role="tab" id="tab-fuentes" aria-selected="false">Variables y fuentes</button>
  </nav>
</div></header>

<main>
<section id="pane-explorar" class="wrap explore">
  <form class="panel" id="controls" autocomplete="off">
    <h2>Controles</h2>
    <div class="loading" id="boot">Cargando datos del Banco Mundial…</div>
  </form>
  <div class="maincol">
    <figure class="canvasbox" style="margin:0">
      <div class="chead">
        <div style="min-width:0">
          <p class="ctitle" id="ctitle">—</p>
          <p class="csub" id="csub"></p>
        </div>
        <span class="cfam" id="cfam"></span>
      </div>
      <div class="plot" id="plot"></div>
      <div id="legend"></div>
      <figcaption class="foot" id="cfoot"></figcaption>
    </figure>
    <div class="warns" id="warns"></div>
  </div>
  <aside class="notecol">
    <div class="note"><h2>Ficha del gráfico</h2><dl id="note"></dl></div>
  </aside>
</section>

<section id="pane-metodologia" class="wrap meth" hidden></section>
<section id="pane-datos" class="wrap" hidden></section>
<section id="pane-fuentes" class="wrap meth" hidden></section>
</main>
<div id="tip" role="status"></div>

<script>
/* ══════════════ 1. REGISTRO DE VARIABLES ══════════════ */
const NUMV = {
  gdppc:   {lab:'PIB per cápita',            unit:'US$ PPA de 2021',        code:'NY.GDP.PCAP.PP.KD', log:true,  d:0},
  life:    {lab:'Esperanza de vida',         unit:'años',                   code:'SP.DYN.LE00.IN',    log:false, d:1},
  pop:     {lab:'Población',                 unit:'personas',               code:'SP.POP.TOTL',       log:true,  d:0},
  fert:    {lab:'Tasa de fecundidad',        unit:'hijos por mujer',        code:'SP.DYN.TFRT.IN',    log:false, d:2},
  co2pc:   {lab:'CO₂ per cápita',            unit:'toneladas por persona',  code:'EN.GHG.CO2.PC.CE.AR5', log:true, d:2},
  urban:   {lab:'Población urbana',          unit:'% del total',            code:'SP.URB.TOTL.IN.ZS', log:false, d:1},
  internet:{lab:'Usuarios de internet',      unit:'% de la población',      code:'IT.NET.USER.ZS',    log:false, d:1},
  u5mort:  {lab:'Mortalidad de menores de 5',unit:'por 1.000 nacidos vivos',code:'SH.DYN.MORT',       log:true,  d:1},
  seced:   {lab:'Matrícula secundaria',      unit:'% bruto',                code:'SE.SEC.ENRR',       log:false, d:1},
  gini:    {lab:'Índice de Gini',            unit:'0 = igualdad perfecta',  code:'SI.POV.GINI',       log:false, d:1},
  unemp:   {lab:'Desempleo',                 unit:'% de la fuerza laboral', code:'SL.UEM.TOTL.ZS',    log:false, d:1},
  growth:  {lab:'Crecimiento del PIB',       unit:'% anual',                code:'NY.GDP.MKTP.KD.ZG', log:false, d:2}
};
const NUMKEYS = Object.keys(NUMV);
const INCOME_ORDER = ['Low income','Lower middle income','Upper middle income','High income'];
const INCOME_ES = {'Low income':'Ingreso bajo','Lower middle income':'Ingreso medio-bajo','Upper middle income':'Ingreso medio-alto','High income':'Ingreso alto'};
const REGION_ES = {
  'East Asia & Pacific':'Asia oriental y Pacífico',
  'Europe & Central Asia':'Europa y Asia central',
  'Latin America & Caribbean':'América Latina y el Caribe',
  'Middle East, North Africa, Afghanistan & Pakistan':'Medio Oriente y Norte de África',
  'North America':'América del Norte',
  'South Asia':'Asia del Sur',
  'Sub-Saharan Africa':'África subsahariana'
};
const TERCIL = ['Tercil bajo','Tercil medio','Tercil alto'];

/* ══════════════ 2. PALETAS ══════════════ */
const PAL = {
  contraste:{lab:'Principal — orden de contraste (13 tonos)', kind:'cat', c:['#d15573','#3d6b9e','#7ab8ae','#e8c468','#9275a8','#6c9ed0','#8a3a52','#f5b88c','#9cccd8','#b89bc7','#8a9aab','#ffc2c0','#f7afb3']},
  principal:{lab:'Principal — orden original (13 tonos)',     kind:'cat', c:['#ffc2c0','#f7afb3','#d15573','#9cccd8','#6c9ed0','#3d6b9e','#8a3a52','#b89bc7','#9275a8','#8a9aab','#7ab8ae','#f5b88c','#e8c468']},
  anclas:   {lab:'Oscuros para destacar (5 tonos)',          kind:'cat', c:['#3d6b9e','#8a3a52','#d15573','#9275a8','#8a9aab']},
  okabe:    {lab:'Okabe-Ito (segura para daltonismo)',       kind:'cat', c:['#0072B2','#E69F00','#009E73','#CC79A7','#56B4E9','#D55E00','#B8A000','#5a5a5a']},
  catgray:  {lab:'Grises (categórica, apta para B/N)',       kind:'cat', c:['#1a1a1a','#555555','#828282','#a8a8a8','#c9c9c9','#3b3b3b','#6e6e6e','#949494']},
  azules:   {lab:'Azules (secuencial)',                      kind:'seq', c:['#eef6f9','#9cccd8','#6c9ed0','#3d6b9e','#24476e']},
  rosas:    {lab:'Rosas (secuencial)',                       kind:'seq', c:['#fff0ef','#ffc2c0','#f7afb3','#d15573','#8a3a52']},
  viridis:  {lab:'Viridis (secuencial, perceptualmente uniforme)', kind:'seq', c:['#440154','#46327e','#365c8d','#277f8e','#1fa187','#4ac16d','#a0da39','#fde725']},
  greys:    {lab:'Grises (secuencial)',                      kind:'seq', c:['#f7f7f7','#d9d9d9','#bdbdbd','#969696','#737373','#525252','#252525']},
  azulrosa: {lab:'Azul–Rosa (divergente)',                   kind:'div', c:['#24476e','#3d6b9e','#6c9ed0','#9cccd8','#e9e9ec','#f7afb3','#d15573','#8a3a52','#5e2335']},
  rainbow:  {lab:'Arcoíris / jet (no recomendada — ver ficha)', kind:'seq', c:['#000080','#0000ff','#00ffff','#00ff00','#ffff00','#ff8000','#ff0000','#800000'], bad:true}
};
/* texto legible sobre un relleno: oscuro sobre tonos claros, blanco sobre tonos oscuros */
function inkOn(col){
  if(typeof col!=='string'||col[0]!=='#')return 'var(--ink)';
  const c=hex2rgb(col).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  const L=0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
  return L>0.36?'#1a1a1a':'#ffffff';
}
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgb2hex(r){return '#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function rampColor(stops,t){
  if(!isFinite(t))return 'var(--axis)';
  t=Math.max(0,Math.min(1,t));
  const n=stops.length-1, i=Math.min(n-1,Math.floor(t*n)), f=t*n-i;
  const a=hex2rgb(stops[i]), b=hex2rgb(stops[i+1]);
  return rgb2hex([0,1,2].map(k=>a[k]+(b[k]-a[k])*f));
}
function catColors(palKey,n,rev){
  const p=PAL[palKey]; const out=[];
  if(p.kind==='cat'){ for(let i=0;i<n;i++) out.push(p.c[i%p.c.length]); }
  else { for(let i=0;i<n;i++) out.push(rampColor(p.c, n===1?0.6:i/(n-1))); }
  return rev? out.reverse() : out;
}
function seqStops(palKey,rev){const c=PAL[palKey].c.slice();return rev?c.reverse():c;}

/* ══════════════ 3. FORMATO Y ESTADÍSTICA ══════════════ */
const F = (v,d)=>v==null||!isFinite(v)?'—':new Intl.NumberFormat('es-AR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}).format(v);
function fmtV(v,key){
  if(v==null||!isFinite(v))return '—';
  const a=Math.abs(v);
  if(key==='pop'){ if(a>=1e6)return F(v/1e6,1)+' M'; if(a>=1e3)return F(v/1e3,0)+' mil'; return F(v,0); }
  if(a>=1e6)return F(v/1e6,1)+' M';
  if(a>=10000)return F(v,0);
  return F(v,(NUMV[key]&&NUMV[key].d!=null)?NUMV[key].d:1);
}
function fmtAxis(v,key){
  const a=Math.abs(v);
  if(a>=1e9)return F(v/1e9,a/1e9<10?1:0)+'MM';
  if(a>=1e6)return F(v/1e6,a/1e6<10?1:0)+'M';
  if(a>=1e4)return F(v/1e3,0)+'k';
  if(a>=1000)return F(Math.round(v),0);
  if(a===0)return '0';
  if(a>=1)return F(v,Number.isInteger(v)?0:1);
  return F(v,2);
}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const sum=a=>a.length?a.reduce((s,x)=>s+x,0):null;
function quantile(sorted,p){
  if(!sorted.length)return null;
  const i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
  return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}
const median=a=>quantile(a.slice().sort((x,y)=>x-y),0.5);
function sd(a){if(a.length<2)return null;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));}
function pearson(x,y){
  const n=x.length; if(n<3)return null;
  const mx=mean(x),my=mean(y); let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const a=x[i]-mx,b=y[i]-my;sxy+=a*b;sxx+=a*a;syy+=b*b;}
  return (sxx&&syy)?sxy/Math.sqrt(sxx*syy):null;
}
function linreg(x,y){
  const mx=mean(x),my=mean(y); let sxy=0,sxx=0;
  for(let i=0;i<x.length;i++){sxy+=(x[i]-mx)*(y[i]-my);sxx+=(x[i]-mx)*(x[i]-mx);}
  const b=sxx?sxy/sxx:0; return {b, a:my-b*mx};
}
function kde(vals,bwMult,gridN,lo,hi){
  const s=sd(vals)||1, n=vals.length;
  const sorted=vals.slice().sort((a,b)=>a-b);
  const iqr=quantile(sorted,0.75)-quantile(sorted,0.25);
  let h=0.9*Math.min(s, (iqr/1.34)||s)*Math.pow(n,-0.2);
  if(!isFinite(h)||h<=0)h=(s*0.3)||1;
  h*=bwMult;
  const out=[];
  for(let i=0;i<gridN;i++){
    const x=lo+(hi-lo)*i/(gridN-1);
    let d=0;
    for(let j=0;j<n;j++){const z=(x-vals[j])/h;d+=Math.exp(-0.5*z*z);}
    out.push({x, y:d/(n*h*Math.sqrt(2*Math.PI))});
  }
  return out;
}
function rng(seed){let s=(seed>>>0)||1;return function(){s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296;};}

/* ══════════════ 4. ESCALAS Y EJES ══════════════ */
function lin(d0,d1,r0,r1){
  if(d0===d1){d0-=1;d1+=1;}
  const f=v=>r0+(v-d0)/(d1-d0)*(r1-r0);
  f.kind='lin';f.dom=[d0,d1];f.ran=[r0,r1];return f;
}
function logs(d0,d1,r0,r1){
  d0=Math.max(d0,1e-6); if(d1<=d0)d1=d0*10;
  const L=Math.log10, a=L(d0), b=L(d1);
  const f=v=>r0+(L(Math.max(v,1e-6))-a)/(b-a)*(r1-r0);
  f.kind='log';f.dom=[d0,d1];f.ran=[r0,r1];return f;
}
function band(dom,r0,r1,padIn){
  padIn=padIn==null?0.22:padIn;
  const n=dom.length||1, step=(r1-r0)/n, bw=step*(1-padIn);
  const idx=new Map(dom.map((d,i)=>[d,i]));
  const f=d=>r0+idx.get(d)*step+(step-bw)/2;
  f.kind='band';f.bw=bw;f.step=step;f.dom=dom;f.ran=[r0,r1];
  f.mid=d=>f(d)+bw/2;
  return f;
}
function niceTicks(d0,d1,n){
  n=n||6;
  const span=d1-d0; if(!(span>0))return [d0];
  const raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const out=[]; for(let t=Math.ceil(d0/step)*step; t<=d1+step*1e-9; t+=step) out.push(+t.toFixed(10));
  return out;
}
function logTicks(d0,d1){
  const out=[];
  for(let e=Math.floor(Math.log10(d0));e<=Math.ceil(Math.log10(d1));e++)
    for(const m of [1,2,5]){const v=m*Math.pow(10,e); if(v>=d0*0.999&&v<=d1*1.001)out.push(v);}
  return out;
}
const ticksOf=(sc,n)=>sc.kind==='log'?logTicks(sc.dom[0],sc.dom[1]):niceTicks(sc.dom[0],sc.dom[1],n);

const NS='http://www.w3.org/2000/svg';
function E(tag,at,parent){
  const e=document.createElementNS(NS,tag);
  if(at)for(const k in at){if(at[k]!=null)e.setAttribute(k,at[k]);}
  if(parent)parent.appendChild(e);
  return e;
}
function T(parent,x,y,txt,cls,extra){
  const o=Object.assign({x:x,y:y,'class':cls||''},extra||{});
  const t=E('text',o,parent); t.textContent=txt; return t;
}
/* cuantos rotulos entran de verdad en el ancho disponible */
function ntick(w,max){return Math.max(2,Math.min(max||6,Math.floor(w/72)));}
function axY(g,sc,iw,label,key,nt){
  const gg=E('g',{'class':'tick'},g);
  const h=sc.ran[0];
  const n=Math.max(2,Math.min(nt||6,Math.floor(h/34)));
  let lastY=1e9;
  for(const t of ticksOf(sc,n)){
    const y=sc(t); if(y<-1||y>h+1)continue;
    E('line',{x1:0,x2:iw,y1:y,y2:y,'class':'gridline'},gg);
    if(lastY-y<11)continue;
    lastY=y;
    T(gg,-8,y+3.5,fmtAxis(t,key),'',{'text-anchor':'end'});
  }
  if(label&&h>170){const t=T(g,0,0,label,'axlabel',{'text-anchor':'middle'});
    t.setAttribute('transform','translate(-48,'+(h/2)+') rotate(-90)');}
}
function axXnum(g,sc,ih,label,key,nt){
  const gg=E('g',{'class':'tick'},g);
  const w=sc.ran[1];
  E('line',{x1:0,x2:w,y1:ih,y2:ih,'class':'axisline'},g);
  let lastX=-1e9;
  for(const t of ticksOf(sc,ntick(w,nt))){
    const x=sc(t); if(x<-1||x>w+1)continue;
    E('line',{x1:x,x2:x,y1:0,y2:ih,'class':'gridline'},gg);
    const lab=fmtAxis(t,key), half=lab.length*2.9;
    if(x-half<lastX+5)continue;
    lastX=x+half;
    T(gg,x,ih+17,lab,'',{'text-anchor':'middle'});
  }
  if(label&&w>300)T(g,w/2,ih+36,label,'axlabel',{'text-anchor':'middle'});
}
/* parte un rótulo en renglones que entren en `room` px; null si alguna palabra sola no entra */
function wrapWords(str,room,wOf){
  const words=String(str).split(' '), lines=[];
  let cur='';
  for(const w of words){
    if(wOf(w)>room)return null;
    const cand=cur?cur+' '+w:w;
    if(wOf(cand)<=room)cur=cand; else {lines.push(cur);cur=w;}
  }
  if(cur)lines.push(cur);
  return lines;
}
function axXband(g,sc,ih,label){
  E('line',{x1:0,x2:sc.ran[1],y1:ih,y2:ih,'class':'axisline'},g);
  const gg=E('g',{'class':'tick'},g);
  const probe=T(gg,0,0,'','',{});
  const wOf=t=>{probe.textContent=t;const w=probe.getComputedTextLength();return w>0?w:t.length*5.8;};
  const room=Math.max(20,sc.step-6);
  const plans=sc.dom.map(d=>wOf(String(d))<=room?[String(d)]:wrapWords(d,room,wOf));
  probe.remove();
  const flat=plans.every(p=>p&&p.length<=3);
  const lineH=13;
  const ang=sc.step>=lineH/Math.sin(40*Math.PI/180)?40:(sc.step>=lineH?Math.round(Math.asin(lineH/sc.step)*180/Math.PI):90);
  const every=sc.step>=lineH?1:Math.ceil(lineH/sc.step);
  if(every>1)sc.thinned=every;
  for(let i=0;i<sc.dom.length;i++){
    const d=sc.dom[i], x=sc.mid(d);
    if(flat){
      const t=T(gg,x,ih+17,'','',{'text-anchor':'middle'});
      plans[i].forEach((ln,j)=>{const ts=E('tspan',{x:x,dy:j?12:0},t);ts.textContent=ln;});
    } else if(i%every===0){
      const t=T(gg,0,0,String(d),'',{'text-anchor':'end'});
      t.setAttribute('transform','translate('+(x+(ang===90?3.5:3))+','+(ih+10)+') rotate(-'+ang+')');
    }
  }
  if(label&&sc.ran[1]>300){
    const bb=gg.getBBox();
    T(g,sc.ran[1]/2,Math.max(ih+34,bb.y+bb.height+16),label,'axlabel',{'text-anchor':'middle'});
  }
  return !flat;
}
/* separa verticalmente rótulos que caerían encima: items [{y}] -> modifica y */
function declutter(items,gap,lo,hi){
  items.sort((a,b)=>a.y-b.y);
  const cap=Math.max(1,Math.floor((hi-lo)/gap)+1);
  if(items.length>cap){const step=items.length/cap;const keep=[];for(let i=0;i<cap;i++)keep.push(items[Math.min(items.length-1,Math.round(i*step))]);items=keep;}
  items.forEach(it=>{it.y=Math.max(lo,Math.min(hi,it.y));});
  for(let i=1;i<items.length;i++)if(items[i].y<items[i-1].y+gap)items[i].y=items[i-1].y+gap;
  if(items.length&&items[items.length-1].y>hi){
    items[items.length-1].y=hi;
    for(let i=items.length-2;i>=0;i--)if(items[i].y>items[i+1].y-gap)items[i].y=items[i+1].y-gap;
  }
  return items;
}
/* agranda el viewBox para que nada quede recortado (rótulos largos, ejes rotados) */
function fitSvg(svg){
  try{
    const vb=svg.viewBox.baseVal, bb=svg.getBBox(), p=4;
    const x0=Math.min(0,bb.x-p), y0=Math.min(0,bb.y-p);
    const x1=Math.max(vb.width,bb.x+bb.width+p), y1=Math.max(vb.height,bb.y+bb.height+p);
    if(x0<0||y0<0||x1>vb.width+0.5||y1>vb.height+0.5){
      svg.setAttribute('viewBox',x0+' '+y0+' '+(x1-x0)+' '+(y1-y0));
      svg.setAttribute('width',x1-x0); svg.setAttribute('height',y1-y0);
    }
  }catch(e){}
}

let RAW=null, YEARS=[];
function yi(y){return YEARS.indexOf(+y);}

/* fila de corte transversal: un país en un año */
function crossSection(year){
  const i=yi(year), out=[];
  for(const c of RAW.countries){
    const r={iso:c.iso, name:c.name, region:REGION_ES[c.region]||c.region, income:INCOME_ES[c.income]||c.income, _inc:c.income, year:+year};
    for(const k of NUMKEYS) r[k]=c[k][i];
    out.push(r);
  }
  return out;
}
/* panel largo: país × año */
function panel(y0,y1){
  const out=[];
  for(const c of RAW.countries){
    for(let y=+y0;y<=+y1;y++){
      const i=yi(y); if(i<0)continue;
      const r={iso:c.iso,name:c.name,region:REGION_ES[c.region]||c.region,income:INCOME_ES[c.income]||c.income,_inc:c.income,year:y};
      for(const k of NUMKEYS) r[k]=c[k][i];
      out.push(r);
    }
  }
  return out;
}
let FACET=null;
function applyFilters(rows,S){
  return rows.filter(r=>{
    if(FACET && FACET.map.get(r.iso)!==FACET.level)return false;
    if(S.fregion!=='all' && r.region!==S.fregion)return false;
    if(S.fincome!=='all' && r.income!==S.fincome)return false;
    if(S.fpop!=='0' && !(r.pop>=+S.fpop))return false;
    return true;
  });
}

/* devuelve {get(row), dom[]} ; dom en orden natural o alfabético */
function catAxis(rows,key,sortAlpha){
  if(key==='income'){
    const present=new Set(rows.map(r=>r.income));
    return {get:r=>r.income, dom:INCOME_ORDER.map(k=>INCOME_ES[k]).filter(d=>present.has(d)), ordered:true};
  }
  if(key==='region'||key==='name'){
    const dom=[...new Set(rows.map(r=>r[key]).filter(v=>v!=null))].sort((a,b)=>a.localeCompare(b,'es'));
    return {get:r=>r[key], dom};
  }
  const nk=key.slice(3);
  const vals=rows.map(r=>r[nk]).filter(v=>v!=null&&isFinite(v)).sort((a,b)=>a-b);
  const t1=quantile(vals,1/3), t2=quantile(vals,2/3);
  const get=r=>{const v=r[nk]; if(v==null||!isFinite(v))return null; return v<t1?TERCIL[0]:v<t2?TERCIL[1]:TERCIL[2];};
  const present=new Set(rows.map(get));
  return {get, dom:TERCIL.filter(d=>present.has(d)), ordered:true, cuts:[t1,t2], nk};
}

/* agregadores */
const AGG={
  mean:  {lab:'Promedio simple',               f:(v)=>mean(v)},
  wmean: {lab:'Promedio ponderado por población', f:(v,rows)=>{let a=0,b=0;rows.forEach((r,i)=>{if(r.pop!=null){a+=v[i]*r.pop;b+=r.pop;}});return b?a/b:null;}},
  median:{lab:'Mediana',                       f:(v)=>median(v)},
  sum:   {lab:'Suma',                          f:(v)=>sum(v)},
  min:   {lab:'Mínimo',                        f:(v)=>v.length?Math.min.apply(null,v):null},
  max:   {lab:'Máximo',                        f:(v)=>v.length?Math.max.apply(null,v):null},
  p25:   {lab:'Percentil 25',                  f:(v)=>quantile(v.slice().sort((a,b)=>a-b),.25)},
  p75:   {lab:'Percentil 75',                  f:(v)=>quantile(v.slice().sort((a,b)=>a-b),.75)},
  sd:    {lab:'Desvío estándar',               f:(v)=>sd(v)},
  count: {lab:'Cantidad de países',            f:(v)=>v.length}
};
/* agrupa y agrega: devuelve [{cat, value, n, rows}] */
function aggregate(rows,cx,numKey,aggKey){
  const m=new Map();
  for(const r of rows){
    const c=cx.get(r); if(c==null)continue;
    const v=r[numKey];
    if(aggKey!=='count' && (v==null||!isFinite(v)))continue;
    if(!m.has(c))m.set(c,[]);
    m.get(c).push(r);
  }
  const out=[];
  for(const c of cx.dom){
    const rs=m.get(c); if(!rs||!rs.length)continue;
    const vals=rs.map(r=>r[numKey]).filter(v=>v!=null&&isFinite(v));
    out.push({cat:c, value:AGG[aggKey].f(vals,rs), n:rs.length, rows:rs});
  }
  return out.filter(d=>d.value!=null&&isFinite(d.value));
}

function frame(host,h,m){

function sortRank(arr,S){
  const s=S.sort;
  if(s==='desc')arr.sort((a,b)=>b.value-a.value);
  else if(s==='asc')arr.sort((a,b)=>a.value-b.value);
  else arr.sort((a,b)=>String(a.cat).localeCompare(String(b.cat),'es'));
  return arr;
}
function cutTop(arr,S,C){
  const n=+S.topn;
  if(!n||arr.length<=n)return arr;
  const kept=arr.slice(0,n);
  C.warn('Se muestran '+n+' de '+arr.length+' categorías. El recorte es una decisión de diseño: cambia el ranking que ve el lector.');
  return kept;
}
function pathOf(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ');}
function arcPath(cx,cy,r0,r1,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const big=(a1-a0)>Math.PI?1:0;
  const A=p(r1,a0),B=p(r1,a1),Cc=p(r0,a1),D=p(r0,a0);
  if(r0<=0)return 'M'+A+'A'+r1+' '+r1+' 0 '+big+' 1 '+B+'L'+cx+' '+cy+'Z';
  return 'M'+A+'A'+r1+' '+r1+' 0 '+big+' 1 '+B+'L'+Cc+'A'+r0+' '+r0+' 0 '+big+' 0 '+D+'Z';
}
function numScale(lo,hi,r0,r1,useLog){
  if(useLog&&lo>0)return logs(lo,hi,r0,r1);
  return lin(lo,hi,r0,r1);
}
function padDom(lo,hi,useLog){
  if(useLog){return [Math.max(lo*0.75,1e-6),hi*1.33];}
  const p=(hi-lo)*0.05||1; return [lo-p,hi+p];
}
function EX(C,lo,hi,slot){return C.ext?C.ext(lo,hi,slot||'v'):[lo,hi];}
const R={};

/* ══════════════ 8. DISTRIBUCIÓN ══════════════ */
R.hist=function(C){
  const S=C.S,k=S.num1,useLog=S.scaleX==='log'&&NUMV[k].log;
  let rows=C.rows.filter(r=>r[k]!=null&&isFinite(r[k])&&(!useLog||r[k]>0));
  const cx=S.cat?catAxis(rows,S.cat):null;
  const vals=rows.map(r=>r[k]);
  const _e=EX(C,Math.min.apply(null,vals),Math.max.apply(null,vals)),lo=_e[0],hi=_e[1];
  const nb=+S.bins;
  const edges=[];
  if(useLog){const a=Math.log10(lo),b=Math.log10(hi);for(let i=0;i<=nb;i++)edges.push(Math.pow(10,a+(b-a)*i/nb));}
  else for(let i=0;i<=nb;i++)edges.push(lo+(hi-lo)*i/nb);
  const groups=cx?cx.dom:['Todos'];
  const counts=groups.map(()=>new Array(nb).fill(0));
  for(const r of rows){
    const gi=cx?groups.indexOf(cx.get(r)):0; if(gi<0)continue;
    let bi=nb-1;
    for(let i=0;i<nb;i++)if(r[k]<edges[i+1]){bi=i;break;}
    counts[gi][bi]++;
  }
  const maxC=Math.max.apply(null,counts.flat());
  const m={t:14,r:16,b:50,l:60};
  const f=frame(C.host,C.h,m);
  const sx=numScale(edges[0],edges[nb],0,f.iw,useLog);
  const sy=lin(0,maxC*1.06,f.ih,0);
  axY(f.g,sy,f.iw,'Cantidad de países','count',5);
  axXnum(f.g,sx,f.ih,NUMV[k].lab+' ('+NUMV[k].unit+')',k,6);
  const cm=cx?colorMap(groups,S):null;
  groups.forEach((gname,gi)=>{
    const col=cm?cm.get(gname):'var(--accent)';
    for(let i=0;i<nb;i++){
      const c=counts[gi][i]; if(!c)continue;
      const x0=sx(edges[i]),x1=sx(edges[i+1]);
      E('rect',{x:x0+1,y:sy(c),width:Math.max(1,x1-x0-2),height:f.ih-sy(c),fill:col,
        'fill-opacity':groups.length>1?0.45:0.9,stroke:col,'stroke-width':groups.length>1?1.5:0,rx:2,'class':'mark',
        'data-tip':(cx?gname+'\n':'')+fmtAxis(edges[i],k)+' a '+fmtAxis(edges[i+1],k)+'\n'+c+' países'},f.g);
    }
  });
  if(cx){
    C.legend(groups.map(g=>[g,cm.get(g)]));
    if(groups.length>5)C.warn('Hay '+groups.length+' distribuciones superpuestas. Más de 4 o 5 se vuelven ilegibles: conviene usar crestas (ridgeline), violines o paneles separados.');
  }
  C.warn('El ancho de clase está fijado en '+nb+' intervalos. Movelo: la misma variable puede parecer unimodal o bimodal según el binning.');
  C.table(['Intervalo','Grupo','Países'], groups.flatMap((g,gi)=>counts[gi].map((c,i)=>({Intervalo:fmtAxis(edges[i],k)+'–'+fmtAxis(edges[i+1],k),Grupo:g,'Países':c}))));
  C.foot('n = '+rows.length+' países con dato. '+(useLog?'Eje X en escala logarítmica. ':''));
};

R.density=function(C){
  const S=C.S,k=S.num1,useLog=S.scaleX==='log'&&NUMV[k].log;
  let rows=C.rows.filter(r=>r[k]!=null&&isFinite(r[k])&&(!useLog||r[k]>0));
  const tf=v=>useLog?Math.log10(v):v;
  const cx=S.cat?catAxis(rows,S.cat):null;
  const groups=cx?cx.dom:['Todos'];
  const all=rows.map(r=>tf(r[k]));
  const _e=EX(C,Math.min.apply(null,all),Math.max.apply(null,all)),lo=_e[0],hi=_e[1],pad=(hi-lo)*0.08;
  const series=groups.map(g=>{
    const v=rows.filter(r=>!cx||cx.get(r)===g).map(r=>tf(r[k]));
    return {g, n:v.length, d:v.length>2?kde(v,+S.bw,120,lo-pad,hi+pad):[]};
  }).filter(s=>s.d.length);
  const maxY=Math.max.apply(null,series.flatMap(s=>s.d.map(p=>p.y)));
  const m={t:14,r:16,b:50,l:60};
  const f=frame(C.host,C.h,m);
  const sx=lin(lo-pad,hi+pad,0,f.iw);
  const sy=lin(0,maxY*1.08,f.ih,0);
  const gg=E('g',{'class':'tick'},f.g);
  E('line',{x1:0,x2:f.iw,y1:f.ih,y2:f.ih,'class':'axisline'},f.g);
  const tks=useLog?logTicks(Math.pow(10,lo-pad),Math.pow(10,hi+pad)).map(v=>[Math.log10(v),v]):niceTicks(lo-pad,hi+pad,ntick(f.iw)).map(v=>[v,v]);
  let lastX=-1e9;
  for(const [tp,lv] of tks){const x=sx(tp);if(x<-1||x>f.iw+1)continue;
    E('line',{x1:x,x2:x,y1:0,y2:f.ih,'class':'gridline'},gg);
    const lab=fmtAxis(lv,k),half=lab.length*2.9;
    if(x-half<lastX+5)continue; lastX=x+half;
    T(gg,x,f.ih+17,lab,'',{'text-anchor':'middle'});}
  if(f.iw>300)T(f.g,f.iw/2,f.ih+36,NUMV[k].lab+' ('+NUMV[k].unit+')','axlabel',{'text-anchor':'middle'});
  axY(f.g,sy,0,'Densidad','',4);
  const cm=cx?colorMap(groups,S):null;
  series.forEach(s=>{
    const col=cm?cm.get(s.g):'var(--accent)';
    const pts=s.d.map(p=>[sx(p.x),sy(p.y)]);
    if(S.fill)E('path',{d:pathOf(pts)+'L'+sx(s.d[s.d.length-1].x)+' '+f.ih+'L'+sx(s.d[0].x)+' '+f.ih+'Z',fill:col,'fill-opacity':series.length>1?0.22:0.3,stroke:'none'},f.g);
    E('path',{d:pathOf(pts),fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','class':'mark','data-tip':s.g+'\nn = '+s.n},f.g);
  });
  if(cx)C.legend(series.map(s=>[s.g+' (n='+s.n+')',cm.get(s.g)]));
  if(series.length>5)C.warn('Hay '+series.length+' curvas superpuestas. Pasado 4 o 5 grupos, el gráfico de crestas o los paneles separados leen mejor.');
  C.warn('El ancho de banda está en ×'+S.bw+'. Es el equivalente del ancho de clase del histograma: suavizar de más borra modas, suavizar de menos inventa picos.');
  C.table(['Grupo','n','Mediana','Desvío'],series.map(s=>{const v=rows.filter(r=>!cx||cx.get(r)===s.g).map(r=>r[k]);return {Grupo:s.g,n:s.n,Mediana:fmtV(median(v),k),'Desvío':fmtV(sd(v),k)};}));
  C.foot('n = '+rows.length+' países. Estimación de densidad por núcleo gaussiano.'+(useLog?' Eje X logarítmico.':''));
};

function groupVals(C,k,cx,useLog){
  const m=new Map();
  for(const r of C.rows){
    const v=r[k]; if(v==null||!isFinite(v))continue; if(useLog&&v<=0)continue;
    const c=cx.get(r); if(c==null)continue;
    if(!m.has(c))m.set(c,[]); m.get(c).push({v,r});
  }
  return cx.dom.filter(d=>m.has(d)&&m.get(d).length).map(d=>{
    const arr=m.get(d), vals=arr.map(o=>o.v).sort((a,b)=>a-b);
    return {cat:d, arr, vals, n:vals.length, q1:quantile(vals,.25), med:quantile(vals,.5), q3:quantile(vals,.75),
            lo:vals[0], hi:vals[vals.length-1], mean:mean(vals), value:quantile(vals,.5)};
  });
}
R.box=function(C){
  const S=C.S,k=S.num1,useLog=S.scaleY==='log'&&NUMV[k].log;
  const cx=catAxis(C.rows,S.cat);
  let G=groupVals(C,k,cx,useLog);
  if(S.sort!=='none')G=sortRank(G,S);
  if(!G.length)return C.empty();
  const _e=EX(C,Math.min.apply(null,G.map(g=>g.lo)),Math.max.apply(null,G.map(g=>g.hi))),lo=_e[0],hi=_e[1];
  const m={t:14,r:16,b:cx.dom.length>5?80:52,l:62};
  const f=frame(C.host,C.h,m);
  const dm=padDom(lo,hi,useLog);
  const sy=numScale(dm[0],dm[1],f.ih,0,useLog);
  const sx=band(G.map(g=>g.cat),0,f.iw,0.4);
  axY(f.g,sy,f.iw,NUMV[k].lab+' ('+NUMV[k].unit+')',k,6);
  axXband(f.g,sx,f.ih,catLabel(S.cat));
  const cm=colorMap(G.map(g=>g.cat),S);
  const rr=rng(99);
  G.forEach(g=>{
    const col=cm.get(g.cat), x=sx(g.cat), bw=sx.bw, mid=x+bw/2;
    const iqr=g.q3-g.q1, wl=Math.max(g.lo,g.q1-1.5*iqr), wh=Math.min(g.hi,g.q3+1.5*iqr);
    E('line',{x1:mid,x2:mid,y1:sy(wl),y2:sy(wh),stroke:'var(--axis)','stroke-width':1},f.g);
    E('line',{x1:mid-bw*0.2,x2:mid+bw*0.2,y1:sy(wl),y2:sy(wl),stroke:'var(--axis)','stroke-width':1},f.g);
    E('line',{x1:mid-bw*0.2,x2:mid+bw*0.2,y1:sy(wh),y2:sy(wh),stroke:'var(--axis)','stroke-width':1},f.g);
    E('rect',{x:x,y:sy(g.q3),width:bw,height:Math.max(1,sy(g.q1)-sy(g.q3)),fill:col,'fill-opacity':0.3,stroke:col,'stroke-width':1.5,rx:2,'class':'mark',
      'data-tip':g.cat+'\nn = '+g.n+'\nmín '+fmtV(g.lo,k)+'\nQ1 '+fmtV(g.q1,k)+'\nmediana '+fmtV(g.med,k)+'\nQ3 '+fmtV(g.q3,k)+'\nmáx '+fmtV(g.hi,k)},f.g);
    E('line',{x1:x,x2:x+bw,y1:sy(g.med),y2:sy(g.med),stroke:col,'stroke-width':2.5},f.g);
    if(S.points){
      g.arr.forEach(o=>{
        E('circle',{cx:mid+(rr()-0.5)*bw*0.62,cy:sy(o.v),r:2.4,fill:col,'fill-opacity':0.55,stroke:'var(--surface)','stroke-width':0.6,'class':'mark',
          'data-tip':o.r.name+'\n'+fmtV(o.v,k)},f.g);
      });
    } else {
      g.arr.filter(o=>o.v<wl||o.v>wh).forEach(o=>{
        E('circle',{cx:mid,cy:sy(o.v),r:2.6,fill:'none',stroke:col,'stroke-width':1.2,'class':'mark','data-tip':o.r.name+'\n'+fmtV(o.v,k)+'\n(atípico)'},f.g);
      });
    }
    T(f.g,mid,sy(wh)-7,'n='+g.n,'dlabel',{'text-anchor':'middle'});
  });
  C.warn('La caja resume cinco números y esconde el resto: dos grupos con la misma caja pueden tener distribuciones muy distintas. El n está anotado sobre cada caja; activá «superponer puntos» para ver la forma real.');
  if(G.some(g=>g.n<8))C.warn('Hay grupos con menos de 8 observaciones. Con tan pocos casos los cuartiles son inestables y el enjambre de puntos es más honesto.');
  C.table(['Grupo','n','Mínimo','Q1','Mediana','Q3','Máximo'],G.map(g=>({Grupo:g.cat,n:g.n,'Mínimo':fmtV(g.lo,k),Q1:fmtV(g.q1,k),Mediana:fmtV(g.med,k),Q3:fmtV(g.q3,k),'Máximo':fmtV(g.hi,k)})));
  C.foot('Bigotes a 1,5 × rango interquartílico. Cada observación es un país en '+S.year+'.');
};

R.violin=function(C){
  const S=C.S,k=S.num1,useLog=S.scaleY==='log'&&NUMV[k].log;
  const cx=catAxis(C.rows,S.cat);
  let G=groupVals(C,k,cx,useLog).filter(g=>g.n>2);
  if(S.sort!=='none')G=sortRank(G,S);
  if(!G.length)return C.empty();
  const tf=v=>useLog?Math.log10(v):v;
  const _e=EX(C,tf(Math.min.apply(null,G.map(g=>g.lo))),tf(Math.max.apply(null,G.map(g=>g.hi)))),lo=_e[0],hi=_e[1],pad=(hi-lo)*0.07;
  const m={t:14,r:16,b:cx.dom.length>5?80:52,l:62};
  const f=frame(C.host,C.h,m);
  const sy=lin(lo-pad,hi+pad,f.ih,0);
  const sx=band(G.map(g=>g.cat),0,f.iw,0.28);
  const gg=E('g',{'class':'tick'},f.g);
  const tks=useLog?logTicks(Math.pow(10,lo-pad),Math.pow(10,hi+pad)).map(v=>[Math.log10(v),v]):niceTicks(lo-pad,hi+pad,Math.max(2,Math.min(6,Math.floor(f.ih/34)))).map(v=>[v,v]);
  let lastY=1e9;
  for(const [tp,lv] of tks){const y=sy(tp);if(y<-1||y>f.ih+1)continue;
    E('line',{x1:0,x2:f.iw,y1:y,y2:y,'class':'gridline'},gg);
    if(lastY-y<11)continue; lastY=y;
    T(gg,-8,y+3.5,fmtAxis(lv,k),'',{'text-anchor':'end'});}
  if(f.ih>170){const lt=T(f.g,0,0,NUMV[k].lab+' ('+NUMV[k].unit+')','axlabel',{'text-anchor':'middle'});
  lt.setAttribute('transform','translate(-48,'+(f.ih/2)+') rotate(-90)');}
  axXband(f.g,sx,f.ih,catLabel(S.cat));
  const cm=colorMap(G.map(g=>g.cat),S);
  const dmax=Math.max.apply(null,G.map(g=>Math.max.apply(null,kde(g.vals.map(tf),+S.bw,60,lo-pad,hi+pad).map(p=>p.y))));
  G.forEach(g=>{
    const col=cm.get(g.cat), mid=sx.mid(g.cat), half=sx.bw/2;
    const d=kde(g.vals.map(tf),+S.bw,70,lo-pad,hi+pad);
    const right=d.map(p=>[mid+p.y/dmax*half,sy(p.x)]);
    const left=d.slice().reverse().map(p=>[mid-p.y/dmax*half,sy(p.x)]);
    E('path',{d:pathOf(right.concat(left))+'Z',fill:col,'fill-opacity':0.35,stroke:col,'stroke-width':1.5,'class':'mark',
      'data-tip':g.cat+'\nn = '+g.n+'\nmediana '+fmtV(g.med,k)+'\nQ1–Q3 '+fmtV(g.q1,k)+' – '+fmtV(g.q3,k)},f.g);
    E('line',{x1:mid,x2:mid,y1:sy(tf(g.q1)),y2:sy(tf(g.q3)),stroke:col,'stroke-width':4,'stroke-linecap':'round'},f.g);
    E('circle',{cx:mid,cy:sy(tf(g.med)),r:3,fill:'var(--surface)',stroke:col,'stroke-width':1.8},f.g);
    T(f.g,mid,8,'n='+g.n,'dlabel',{'text-anchor':'middle'});
  });
  C.warn('El violín necesita suficientes observaciones por grupo para decir algo: con n chico dibuja una forma suave que los datos no sostienen. El ancho está normalizado al máximo del gráfico, así que compara formas, no áreas.');
  C.table(['Grupo','n','Mediana','Q1','Q3'],G.map(g=>({Grupo:g.cat,n:g.n,Mediana:fmtV(g.med,k),Q1:fmtV(g.q1,k),Q3:fmtV(g.q3,k)})));
  C.foot('Punto = mediana; barra gruesa = rango interquartílico. Ancho de banda ×'+S.bw+'.');
};

R.swarm=function(C){
  const S=C.S,k=S.num1,useLog=S.scaleY==='log'&&NUMV[k].log;

R.ridge=function(C){
  const S=C.S,k=S.num1;
  const cx=catAxis(C.rows,S.cat);
  let G=groupVals(C,k,cx,false).filter(g=>g.n>2);
  if(S.sort!=='none')G=sortRank(G,S);
  if(!G.length)return C.empty();
  const _e=EX(C,Math.min.apply(null,G.map(g=>g.lo)),Math.max.apply(null,G.map(g=>g.hi))),lo=_e[0],hi=_e[1],pad=(hi-lo)*0.06;
  const m={t:18,r:16,b:50,l:Math.min(170,Math.max(90,...G.map(g=>String(g.cat).length*6.3)))};
  const f=frame(C.host,Math.max(C.h,G.length*52+70),m);
  const sx=lin(lo-pad,hi+pad,0,f.iw);
  const rowH=f.ih/G.length;
  const ov=+S.overlap;
  const dens=G.map(g=>kde(g.vals,+S.bw,100,lo-pad,hi+pad));
  const dmax=Math.max.apply(null,dens.flatMap(d=>d.map(p=>p.y)));
  const gg=E('g',{'class':'tick'},f.g);
  let lastX=-1e9;
  for(const t of niceTicks(lo-pad,hi+pad,ntick(f.iw))){const x=sx(t);if(x<-1||x>f.iw+1)continue;
    E('line',{x1:x,x2:x,y1:0,y2:f.ih,'class':'gridline'},gg);
    const lab=fmtAxis(t,k),half=lab.length*2.9;
    if(x-half<lastX+5)continue; lastX=x+half;
    T(gg,x,f.ih+17,lab,'',{'text-anchor':'middle'});}
  if(f.iw>300)T(f.g,f.iw/2,f.ih+36,NUMV[k].lab+' ('+NUMV[k].unit+')','axlabel',{'text-anchor':'middle'});
  const cm=colorMap(G.map(g=>g.cat),S);
  for(let i=G.length-1;i>=0;i--){
    const g=G[i],col=cm.get(g.cat),base=rowH*(i+1),amp=rowH*ov;
    const pts=dens[i].map(p=>[sx(p.x),base-p.y/dmax*amp]);
    E('path',{d:pathOf(pts)+'L'+f.iw+' '+base+'L0 '+base+'Z',fill:col,'fill-opacity':0.72,stroke:'var(--surface)','stroke-width':1.2,'class':'mark',
      'data-tip':g.cat+'\nn = '+g.n+'\nmediana '+fmtV(g.med,k)},f.g);
    E('line',{x1:0,x2:f.iw,y1:base,y2:base,stroke:'var(--axis)','stroke-width':0.8},f.g);
    T(f.g,-10,base-3,g.cat,'',{'text-anchor':'end','font-size':11});
  }
  C.warn('Las crestas se tapan entre sí: con mucho solapamiento una distribución puede ocultar la de abajo. Bajá el solapamiento para comparar con menos ruido, subilo para ganar compacidad.');
  if(G.length>12)C.warn('Con '+G.length+' crestas el eje vertical se vuelve una lista larga; conviene recortar grupos.');
  C.table(['Grupo','n','Mediana','Q1','Q3'],G.map(g=>({Grupo:g.cat,n:g.n,Mediana:fmtV(g.med,k),Q1:fmtV(g.q1,k),Q3:fmtV(g.q3,k)})));
  C.foot('Cada cresta es una densidad por núcleo con la misma escala horizontal. Ancho de banda ×'+S.bw+'.');
};

/* ══════════════ 9. RANKING ══════════════ */
function rankData(C){
  const S=C.S,k=S.num1;
  const cx=catAxis(C.rows,S.cat);
  let D=aggregate(C.rows,cx,k,S.agg);
  D=sortRank(D,S);
  if(S.cat==='name'||D.length>+S.topn)D=cutTop(D,S,C);
  return {D,cx,k};
}
function barFoot(C,D,cx){
  const S=C.S;
  C.foot('Agregación: '+AGG[S.agg].lab.toLowerCase()+' de '+low(NUMV[S.num1].lab)+' por '+low(catLabel(S.cat))+', año '+S.year+'. '+D.length+' categorías.');
  if(!S.zero)C.warn('El eje no arranca en cero: la longitud de las barras ya no es proporcional al valor y las diferencias se ven amplificadas. En barras, cortar el eje es un error; en puntos o líneas es defendible.');
  if(S.agg==='mean'&&(S.cat==='region'||S.cat==='income'))C.warn('Es un promedio simple entre países: Luxemburgo pesa igual que India. Probá «promedio ponderado por población» y comparalo.');
  if(S.agg==='sum'&&['life','fert','gini','unemp','growth','urban','internet','seced','u5mort','gdppc','co2pc'].indexOf(S.num1)>=0)C.warn('Estás sumando una variable que es una tasa o un promedio. La suma de tasas de países no tiene interpretación: usá promedio, mediana o promedio ponderado.');
}
R.bar=function(C){
  const S=C.S,{D,cx,k}=rankData(C);
  if(!D.length)return C.empty();
  const m={t:18,r:16,b:D.length>6||S.cat==='name'?92:52,l:66};
  const f=frame(C.host,C.h,m);
  const _e=EX(C,Math.min.apply(null,D.map(d=>d.value)),Math.max.apply(null,D.map(d=>d.value))),mn=_e[0],mx=_e[1];
  const y0=S.zero?Math.min(0,mn):mn-(mx-mn)*0.12;
  const sy=lin(y0,mx+(mx-y0)*0.08,f.ih,0);
  const sx=band(D.map(d=>d.cat),0,f.iw,0.26);
  axY(f.g,sy,f.iw,NUMV[k].lab+' ('+NUMV[k].unit+')',k,6);
  axXband(f.g,sx,f.ih,catLabel(S.cat));
  const cm=colorMap(D.map(d=>d.cat),S);
  const zero=sy(Math.max(y0,0));
  let skipped=0;
  D.forEach(d=>{
    const yv=sy(d.value),x=sx(d.cat);
    E('rect',{x:x,y:Math.min(yv,zero),width:sx.bw,height:Math.max(1,Math.abs(zero-yv)),fill:cm.get(d.cat),rx:3,'class':'mark',
      'data-tip':d.cat+'\n'+fmtV(d.value,k)+'\n'+d.n+' país(es)'},f.g);
    if(S.labels&&fmtV(d.value,k).length*5.6<=sx.step-2)T(f.g,sx.mid(d.cat),yv-6,fmtV(d.value,k),'dlabel',{'text-anchor':'middle'});
    else if(S.labels)skipped++;
  });
  if(y0<0||mn<0)E('line',{x1:0,x2:f.iw,y1:sy(0),y2:sy(0),stroke:'var(--ink)','stroke-width':1},f.g);
  if(skipped)C.warn('Las barras son demasiado angostas para llevar el valor encima. Con muchas categorías, las barras horizontales dejan lugar para el rótulo y el número.');
  C.table([catLabel(S.cat),'Valor','Países'],D.map(d=>({[catLabel(S.cat)]:d.cat,Valor:fmtV(d.value,k),'Países':d.n})));
  barFoot(C,D,cx);
  if(sx.thinned)C.warn('Hay demasiadas categorías para rotular todas: se muestra una de cada '+sx.thinned+'. Pasá el mouse para ver el resto, o usá barras horizontales.');
  if(S.sort==='none'&&S.cat!=='income')C.warn('Las categorías están en orden alfabético. Ordenarlas por valor casi siempre revela el patrón; dejalas alfabéticas solo si el lector va a buscar una categoría puntual.');
};
R.barh=function(C){
  const S=C.S,{D,cx,k}=rankData(C);

  const lw=Math.min(190,Math.max(80,...D.map(d=>String(d.cat).length*6.4)));

  C.warn('Las barras horizontales resuelven el problema de las etiquetas largas sin rotarlas. Es la opción por defecto cuando las categorías son nombres de países.');

  C.warn('El bastón reduce la tinta y evita el efecto muaré de muchas barras parejas, pero codifica el valor en la posición del punto: si el eje no arranca en cero, es menos engañoso que una barra, aunque igual conviene avisarlo.');
};
function twoYear(C){
  const S=C.S,k=S.num1;
  const yA=Math.min(+S.year,+S.year2), yB=Math.max(+S.year,+S.year2);
  const rA=applyFilters(crossSection(yA),S), rB=applyFilters(crossSection(yB),S);
  const cxA=catAxis(rA,S.cat), cxB=catAxis(rB,S.cat);
  const A=new Map(aggregate(rA,cxA,k,S.agg).map(d=>[d.cat,d.value]));
  const B=new Map(aggregate(rB,cxB,k,S.agg).map(d=>[d.cat,d.value]));
  let D=[...A.keys()].filter(c=>B.has(c)).map(c=>({cat:c,a:A.get(c),b:B.get(c),value:B.get(c)-A.get(c)}));
  if(S.sort==='desc')D.sort((x,y)=>y.b-x.b); else if(S.sort==='asc')D.sort((x,y)=>x.b-y.b);
  else if(S.sort==='change')D.sort((x,y)=>y.value-x.value);
  else D.sort((x,y)=>String(x.cat).localeCompare(String(y.cat),'es'));
  if(D.length>+S.topn)D=cutTop(D,S,C);
  return {D,k,yA,yB};
}
R.dumbbell=function(C){
  const S=C.S,{D,k,yA,yB}=twoYear(C);
  if(!D.length)return C.empty();
  const lw=Math.min(190,Math.max(80,...D.map(d=>String(d.cat).length*6.4)));
  const m={t:14,r:26,b:46,l:lw};
  const f=frame(C.host,Math.max(C.h,D.length*24+70),m);
  const all=D.flatMap(d=>[d.a,d.b]);
  const _e=EX(C,Math.min.apply(null,all),Math.max.apply(null,all));
  const sx=lin(_e[0],_e[1],0,f.iw);
  const sy=band(D.map(d=>d.cat),0,f.ih,0.2);
  axXnum(f.g,sx,f.ih,NUMV[k].lab+' ('+NUMV[k].unit+')',k,5);
  const cs=catColors(S.pal,2,S.prev);
  D.forEach(d=>{
    const yc=sy.mid(d.cat);
    E('line',{x1:sx(d.a),x2:sx(d.b),y1:yc,y2:yc,stroke:'var(--axis)','stroke-width':2.5,'stroke-linecap':'round'},f.g);
    E('circle',{cx:sx(d.a),cy:yc,r:4.4,fill:cs[0],stroke:'var(--surface)','stroke-width':1,'class':'mark','data-tip':d.cat+'\n'+yA+': '+fmtV(d.a,k)},f.g);
    E('circle',{cx:sx(d.b),cy:yc,r:4.4,fill:cs[1],stroke:'var(--surface)','stroke-width':1,'class':'mark','data-tip':d.cat+'\n'+yB+': '+fmtV(d.b,k)+'\ncambio: '+(d.value>0?'+':'')+fmtV(d.value,k)},f.g);
    T(f.g,-9,yc+3.5,d.cat,'',{'text-anchor':'end','font-size':11});
  });
  C.legend([[String(yA),cs[0]],[String(yB),cs[1]]]);
  C.table([catLabel(S.cat),String(yA),String(yB),'Cambio'],D.map(d=>({[catLabel(S.cat)]:d.cat,[yA]:fmtV(d.a,k),[yB]:fmtV(d.b,k),Cambio:(d.value>0?'+':'')+fmtV(d.value,k)})));
  C.foot('Dos cortes: '+yA+' y '+yB+'. Agregación: '+AGG[S.agg].lab.toLowerCase()+'.');
  C.warn('El dumbbell muestra el punto de partida, el de llegada y la brecha, pero nada de lo que pasó en el medio. Si el camino importa (crisis, rebote), usá líneas.');
};
R.slope=function(C){
  const S=C.S,{D,k,yA,yB}=twoYear(C);
  if(!D.length)return C.empty();
  const Wd=Math.max(300,Math.floor(C.host.clientWidth||680)), narrow=Wd<520;
  const lw=Math.min(narrow?70:160,Math.max(40,...D.map(d=>(String(d.cat).length+8)*5.6)));
  const m={t:26,r:narrow?Math.min(130,Wd*0.42):lw,b:20,l:narrow?44:lw};
  const f=frame(C.host,Math.max(C.h,D.length*15+70),m);
  const all=D.flatMap(d=>[d.a,d.b]);
  const _e2=EX(C,Math.min.apply(null,all),Math.max.apply(null,all));
  const sy=lin(_e2[0],_e2[1],f.ih,0);
  const cm=colorMap(D.map(d=>d.cat),S);
  E('line',{x1:0,x2:0,y1:0,y2:f.ih,stroke:'var(--axis)'},f.g);
  E('line',{x1:f.iw,x2:f.iw,y1:0,y2:f.ih,stroke:'var(--axis)'},f.g);
  T(f.g,0,-12,String(yA),'axlabel',{'text-anchor':'middle'});
  T(f.g,f.iw,-12,String(yB),'axlabel',{'text-anchor':'middle'});
  D.forEach(d=>{
    const col=cm.get(d.cat),y1=sy(d.a),y2=sy(d.b);
    E('line',{x1:0,x2:f.iw,y1:y1,y2:y2,stroke:col,'stroke-width':1.8,'class':'mark',
      'data-tip':d.cat+'\n'+yA+': '+fmtV(d.a,k)+'\n'+yB+': '+fmtV(d.b,k)+'\ncambio: '+(d.value>0?'+':'')+fmtV(d.value,k)},f.g);
    E('circle',{cx:0,cy:y1,r:3,fill:col},f.g);
    E('circle',{cx:f.iw,cy:y2,r:3,fill:col},f.g);
  });
  const L=declutter(D.map(d=>({d:d,y:sy(d.a)})),13,0,f.ih), Rr=declutter(D.map(d=>({d:d,y:sy(d.b)})),13,0,f.ih);
  L.forEach(it=>T(f.g,-8,it.y+3.5,narrow?fmtV(it.d.a,k):it.d.cat+'  '+fmtV(it.d.a,k),'',{'text-anchor':'end','font-size':10.5}));
  Rr.forEach(it=>T(f.g,f.iw+8,it.y+3.5,fmtV(it.d.b,k)+'  '+it.d.cat,'',{'font-size':10.5}));
  C.table([catLabel(S.cat),String(yA),String(yB),'Cambio'],D.map(d=>({[catLabel(S.cat)]:d.cat,[yA]:fmtV(d.a,k),[yB]:fmtV(d.b,k),Cambio:(d.value>0?'+':'')+fmtV(d.value,k)})));
  C.foot('Pendientes entre '+yA+' y '+yB+'. La inclinación es el cambio; el cruce de líneas es un reordenamiento.');
  if(D.length>18)C.warn('Con '+D.length+' líneas las etiquetas se pisan. El slopegraph funciona con pocas categorías o resaltando unas pocas.');
};

/* ══════════════ 10. CORRELACIÓN ══════════════ */
R.scatter=function(C){
  const S=C.S,kx=S.num1,ky=S.num2;
  const lx=S.scaleX==='log'&&NUMV[kx].log, ly=S.scaleY==='log'&&NUMV[ky].log;
  let rows=C.rows.filter(r=>r[kx]!=null&&r[ky]!=null&&isFinite(r[kx])&&isFinite(r[ky])&&(!lx||r[kx]>0)&&(!ly||r[ky]>0));
  if(!rows.length)return C.empty();
  const cx=S.cat?catAxis(rows,S.cat):null;
  const m={t:16,r:18,b:50,l:66};
  const f=frame(C.host,C.h,m);
  const xs=rows.map(r=>r[kx]),ys=rows.map(r=>r[ky]);
  const ex=EX(C,Math.min.apply(null,xs),Math.max.apply(null,xs),'x'), ey=EX(C,Math.min.apply(null,ys),Math.max.apply(null,ys),'y');
  const dx=padDom(ex[0],ex[1],lx);
  const dy=padDom(ey[0],ey[1],ly);
  const sx=numScale(dx[0],dx[1],0,f.iw,lx), sy=numScale(dy[0],dy[1],f.ih,0,ly);
  axY(f.g,sy,f.iw,NUMV[ky].lab+' ('+NUMV[ky].unit+')',ky,6);
  axXnum(f.g,sx,f.ih,NUMV[kx].lab+' ('+NUMV[kx].unit+')',kx,6);
  const cm=cx?colorMap(cx.dom,S):null;
  rows.forEach(r=>{
    const col=cm?(cm.get(cx.get(r))||'var(--axis)'):'var(--accent)';
    E('circle',{cx:sx(r[kx]),cy:sy(r[ky]),r:4.2,fill:col,'fill-opacity':0.68,stroke:'var(--surface)','stroke-width':0.8,'class':'mark',
      'data-tip':r.name+'\n'+NUMV[kx].lab+': '+fmtV(r[kx],kx)+'\n'+NUMV[ky].lab+': '+fmtV(r[ky],ky)},f.g);
  });
  if(S.labels){
    const sorted=rows.slice().sort((a,b)=>(b.pop||0)-(a.pop||0)).slice(0,12);
    const placed=[];
    const hit=(r)=>placed.some(q=>r.x0<q.x1&&r.x1>q.x0&&r.y0<q.y1&&r.y1>q.y0)||r.x0<0||r.x1>f.iw||r.y0<0||r.y1>f.ih;
    sorted.forEach(r=>{
      const px=sx(r[kx]),py=sy(r[ky]),w=r.name.length*5.4+2,h=11;
      const opts=[[6,-6,'start'],[6,12,'start'],[-6,-6,'end'],[-6,12,'end']];
      for(const o of opts){
        const x0=o[2]==='start'?px+o[0]:px+o[0]-w, y1=py+o[1]+2;
        const box={x0:x0,x1:x0+w,y0:y1-h,y1:y1};
        if(!hit(box)){placed.push(box);T(f.g,px+o[0],py+o[1],r.name,'dlabel',{'text-anchor':o[2]});break;}
      }
    });
  }
  const tx=lx?xs.map(Math.log10):xs, ty=ly?ys.map(Math.log10):ys;
  const rr=pearson(tx,ty);
  if(S.trend){
    const {a,b}=linreg(tx,ty);
    const x0=lx?Math.log10(dx[0]):dx[0], x1=lx?Math.log10(dx[1]):dx[1];
    const Y=v=>{const y=a+b*v;return ly?Math.pow(10,y):y;};
    const X=v=>lx?Math.pow(10,v):v;
    E('line',{x1:sx(X(x0)),y1:sy(Y(x0)),x2:sx(X(x1)),y2:sy(Y(x1)),stroke:'var(--ink)','stroke-width':1.6,'stroke-dasharray':'6 4'},f.g);
  }
  if(cx)C.legend(cx.dom.filter(d=>rows.some(r=>cx.get(r)===d)).map(d=>[d,cm.get(d)]));
  C.table(['País',NUMV[kx].lab,NUMV[ky].lab,'Región'],rows.map(r=>({'País':r.name,[NUMV[kx].lab]:fmtV(r[kx],kx),[NUMV[ky].lab]:fmtV(r[ky],ky),'Región':r.region})));
  C.foot('n = '+rows.length+' países en '+S.year+'. Correlación de Pearson'+((lx||ly)?' sobre las variables transformadas':'')+': r = '+F(rr,2)+'.'+(S.trend?' La recta es un ajuste por mínimos cuadrados.':''));
  if(lx||ly)C.warn('Hay al menos un eje logarítmico: distancias iguales son razones iguales, no diferencias iguales. Es lo adecuado para variables muy asimétricas como el PIB per cápita, pero hay que decirlo en la lectura.');
  if(rows.length>120)C.warn('Con '+rows.length+' puntos hay superposición. La transparencia ayuda, pero para muestras grandes conviene densidad 2D, hexbins o muestreo.');
  if(S.trend)C.warn('La recta de ajuste no implica causalidad ni que la relación sea lineal. Si el patrón es curvo, la recta oculta la forma.');
  C.warn('Cada punto es un país, no una persona. Las relaciones entre agregados nacionales pueden invertirse al mirar grupos dentro de los países (paradoja de Simpson): probá colorear por grupo de ingreso.');
};
R.bubble=function(C){
  const S=C.S,kx=S.num1,ky=S.num2,ks=S.num3;
  const lx=S.scaleX==='log'&&NUMV[kx].log, ly=S.scaleY==='log'&&NUMV[ky].log;
  let rows=C.rows.filter(r=>[kx,ky,ks].every(k=>r[k]!=null&&isFinite(r[k]))&&(!lx||r[kx]>0)&&(!ly||r[ky]>0)&&r[ks]>0);
  if(!rows.length)return C.empty();
  const cx=S.cat?catAxis(rows,S.cat):null;
  const m={t:16,r:18,b:50,l:66};
  const f=frame(C.host,C.h,m);
  const xs=rows.map(r=>r[kx]),ys=rows.map(r=>r[ky]),ss=rows.map(r=>r[ks]);
  const ex=EX(C,Math.min.apply(null,xs),Math.max.apply(null,xs),'x'), ey=EX(C,Math.min.apply(null,ys),Math.max.apply(null,ys),'y');
  const dx=padDom(ex[0],ex[1],lx);
  const dy=padDom(ey[0],ey[1],ly);
  const sx=numScale(dx[0],dx[1],0,f.iw,lx), sy=numScale(dy[0],dy[1],f.ih,0,ly);
  const smax=EX(C,0,Math.max.apply(null,ss),'s')[1], rmax=Math.min(34,f.iw/11);
  const rad=v=>Math.max(2.5,Math.sqrt(v/smax)*rmax);
  axY(f.g,sy,f.iw,NUMV[ky].lab+' ('+NUMV[ky].unit+')',ky,6);
  axXnum(f.g,sx,f.ih,NUMV[kx].lab+' ('+NUMV[kx].unit+')',kx,6);
  const cm=cx?colorMap(cx.dom,S):null;
  rows.slice().sort((a,b)=>b[ks]-a[ks]).forEach(r=>{
    const col=cm?(cm.get(cx.get(r))||'var(--axis)'):'var(--accent)';
    E('circle',{cx:sx(r[kx]),cy:sy(r[ky]),r:rad(r[ks]),fill:col,'fill-opacity':0.5,stroke:col,'stroke-width':1.4,'class':'mark',
      'data-tip':r.name+'\n'+NUMV[kx].lab+': '+fmtV(r[kx],kx)+'\n'+NUMV[ky].lab+': '+fmtV(r[ky],ky)+'\n'+NUMV[ks].lab+': '+fmtV(r[ks],ks)},f.g);
  });
  if(cx)C.legend(cx.dom.filter(d=>rows.some(r=>cx.get(r)===d)).map(d=>[d,cm.get(d)]));
  if(f.iw>300){
    const big=rad(smax), sg=E('g',{transform:'translate('+(f.iw-big-70)+','+(big*2+18)+')'},f.g);
    T(sg,big,-big*2-8,NUMV[ks].lab,'dlabel',{'text-anchor':'middle'});
    [smax,smax/4].forEach((v,i)=>{const rr=rad(v);
      E('circle',{cx:big,cy:-rr,r:rr,fill:'none',stroke:'var(--axis)','stroke-width':1},sg);
      E('line',{x1:big,x2:big*2+8,y1:-rr*2,y2:-rr*2,stroke:'var(--axis)','stroke-dasharray':'2 2'},sg);
      T(sg,big*2+11,-rr*2+3.5,fmtV(v,ks),'dlabel',{});});
  }

R.corr=function(C){

  if(cx)C.legend(cx.dom.filter(d=>rows.some(r=>cx.get(r)===d)).map(d=>[d,cm.get(d)]));

function partData(C){
  const S=C.S,k=S.num1;
  const cx=catAxis(C.rows,S.cat);
  let D=aggregate(C.rows,cx,k,S.agg);
  D.sort((a,b)=>b.value-a.value);
  const neg=D.filter(d=>d.value<0).length;
  D=D.filter(d=>d.value>0);
  if(neg)C.warn(neg+' categoría(s) con valor negativo quedaron excluidas: un gráfico de parte de un todo no puede representar partes negativas.');
  const n=+S.topn;
  if(D.length>n){
    const rest=D.slice(n), other=sum(rest.map(d=>d.value));
    D=D.slice(0,n).concat([{cat:'Resto ('+rest.length+')',value:other,n:sum(rest.map(d=>d.n))}]);
  }
  const tot=sum(D.map(d=>d.value));
  D.forEach(d=>d.share=d.value/tot);
  return {D,k,tot};
}

R.treemap=function(C){
  const S=C.S,{D,k,tot}=partData(C);
  if(!D.length)return C.empty();
  const W=Math.max(300,Math.floor(C.host.clientWidth||680)), H=Math.min(C.h,520);
  C.host.innerHTML='';
  const svg=E('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img'},C.host);
  /* squarify */
  function worst(row,w,tot2){
    const s=sum(row.map(d=>d.value)), mx=Math.max.apply(null,row.map(d=>d.value)), mn=Math.min.apply(null,row.map(d=>d.value));
    const s2=s*s, w2=w*w;
    return Math.max(w2*mx/s2,s2/(w2*mn));
  }
  const rects=[];
  function squarify(items,x,y,w,h){
    if(!items.length)return;
    if(items.length===1){rects.push({d:items[0],x,y,w,h});return;}
    const total=sum(items.map(d=>d.value));
    const horiz=w>=h, side=horiz?h:w;
    let row=[],i=0;
    while(i<items.length){
      const cand=row.concat([items[i]]);
      const scale=(horiz?w*h:w*h)/total;
      if(row.length&&worst(row.map(d=>({value:d.value*scale/side})),side,total)<worst(cand.map(d=>({value:d.value*scale/side})),side,total))break;
      row=cand;i++;
    }
    const rs=sum(row.map(d=>d.value));
    const frac=rs/total;
    if(horiz){
      const rw=w*frac; let yy=y;
      row.forEach(d=>{const rh=h*(d.value/rs);rects.push({d,x,y:yy,w:rw,h:rh});yy+=rh;});
      squarify(items.slice(i),x+rw,y,w-rw,h);
    }else{
      const rh=h*frac; let xx=x;
      row.forEach(d=>{const rw=w*(d.value/rs);rects.push({d,x:xx,y,w:rw,h:rh});xx+=rw;});
      squarify(items.slice(i),x,y+rh,w,h-rh);
    }
  }
  squarify(D.slice(),0,0,W,H);
  const cm=colorMap(D.map(d=>d.cat),S);
  rects.forEach(R2=>{
    const d=R2.d;
    E('rect',{x:R2.x+1,y:R2.y+1,width:Math.max(0,R2.w-2),height:Math.max(0,R2.h-2),fill:cm.get(d.cat),rx:2,'class':'mark',
      'data-tip':d.cat+'\n'+fmtV(d.value,k)+'\n'+F(d.share*100,1)+' % del total'},svg);
    if(S.labels&&R2.w>58&&R2.h>26){
      T(svg,R2.x+7,R2.y+18,d.cat.length>Math.floor(R2.w/6.4)?d.cat.slice(0,Math.floor(R2.w/6.4)-1)+'…':d.cat,'',{'style':'stroke:none','fill':inkOn(cm.get(d.cat)),'font-size':11,'font-weight':500});
      if(R2.h>42)T(svg,R2.x+7,R2.y+32,F(d.share*100,1)+'%','dlabel',{'style':'stroke:none','fill':inkOn(cm.get(d.cat))});
    }
  });
  C.legend(D.slice(0,12).map(d=>[d.cat+' — '+F(d.share*100,1)+'%',cm.get(d.cat)]));
  C.table([catLabel(S.cat),'Valor','Participación'],D.map(d=>({[catLabel(S.cat)]:d.cat,Valor:fmtV(d.value,k),'Participación':F(d.share*100,1)+' %'})));
  C.foot('Área proporcional a '+low(NUMV[k].lab)+', '+S.year+'. Total: '+fmtV(tot,k)+'.');
  C.warn('El área es un canal impreciso: se lee bien quién es grande y quién es chico, no cuánto más. Dos rectángulos de forma distinta y área parecida se perciben distintos.');
  C.warn('El treemap aprovecha el espacio mejor que la torta y tolera muchas categorías, pero pierde el orden: no hay un eje donde leer el ranking.');
};

function stackData(C){
  const S=C.S,k=S.num1;

  for(const r of C.rows){
    const a=cxA.get(r),b=cxB.get(r); if(a==null||b==null)continue;
    const key=a+'||'+b;
    if(!cells.has(key))cells.set(key,[]);
    cells.get(key).push(r);
  }
  const data=cxA.dom.map(a=>{
    const seg=cxB.dom.map(b=>{
      const rs=cells.get(a+'||'+b)||[];
      const vals=rs.map(r=>r[k]).filter(v=>v!=null&&isFinite(v));
      const v=(S.agg==='count')?rs.length:(vals.length?AGG[S.agg].f(vals,rs):0);
      return {b, v:(v==null||!isFinite(v))?0:v, n:rs.length};
    });
    return {a, seg, total:sum(seg.map(s=>s.v))||0};
  }).filter(d=>d.total>0);

function tsData(C){

function crossAgg(C){
  const S=C.S,k=S.num1;
  const cxA=catAxis(C.rows,S.cat), cxB=catAxis(C.rows,S.cat2);
  const m=new Map();
  for(const r of C.rows){
    const a=cxA.get(r),b=cxB.get(r); if(a==null||b==null)continue;
    const key=a+'||'+b; if(!m.has(key))m.set(key,[]); m.get(key).push(r);
  }
  let D=cxA.dom.map(a=>{
    const seg=cxB.dom.map(b=>{
      const rs=m.get(a+'||'+b)||[];
      const vals=rs.map(r=>r[k]).filter(v=>v!=null&&isFinite(v));
      const v=(S.agg==='count')?rs.length:(vals.length?AGG[S.agg].f(vals,rs):null);
      return {b, v:(v==null||!isFinite(v))?null:v, n:rs.length};
    });
    const got=seg.filter(s=>s.v!=null).map(s=>s.v);
    return {cat:a, seg, lo:got.length?Math.min.apply(null,got):null, hi:got.length?Math.max.apply(null,got):null,
            gap:got.length>1?Math.max.apply(null,got)-Math.min.apply(null,got):0};
  }).filter(d=>d.lo!=null);
  if(S.sort==='desc')D.sort((x,y)=>y.hi-x.hi);
  else if(S.sort==='asc')D.sort((x,y)=>x.hi-y.hi);
  else if(S.sort==='change')D.sort((x,y)=>y.gap-x.gap);
  else D.sort((x,y)=>String(x.cat).localeCompare(String(y.cat),'es'));
  if(D.length>+S.topn)D=cutTop(D,S,C);
  return {D,cxA,cxB,k};
}
R.cleveland=function(C){

R.gap=function(C){
  const S=C.S,k=S.num1;
  const cx=catAxis(C.rows,S.cat);
  let D=aggregate(C.rows,cx,k,S.agg);
  if(!D.length)return C.empty();
  const all=D.map(d=>d.value);
  const ref=S.ref==='zero'?0:S.ref==='median'?median(all):mean(all);
  const refLab=S.ref==='zero'?'cero':S.ref==='median'?'la mediana del conjunto':'el promedio del conjunto';
  D=D.map(d=>Object.assign({},d,{dev:d.value-ref}));
  if(S.sort==='asc')D.sort((a,b)=>a.dev-b.dev);
  else if(S.sort==='none')D.sort((a,b)=>String(a.cat).localeCompare(String(b.cat),'es'));
  else D.sort((a,b)=>b.dev-a.dev);
  if(D.length>+S.topn)D=cutTop(D,S,C);
  const _e=EX(C,Math.min.apply(null,D.map(d=>d.dev)),Math.max.apply(null,D.map(d=>d.dev)));
  const span=Math.max(Math.abs(_e[0]),Math.abs(_e[1]))*1.08||1;
  const lw=Math.min(190,Math.max(80,...D.map(d=>String(d.cat).length*6.4)));
  const m={t:14,r:S.labels?62:22,b:46,l:lw};
  const f=frame(C.host,Math.max(C.h,D.length*26+70),m);
  const sx=lin(-span,span,0,f.iw);
  const sy=band(D.map(d=>d.cat),0,f.ih,0.26);
  axXnum(f.g,sx,f.ih,'Desvío respecto de '+refLab+' ('+NUMV[k].unit+')',k,5);
  const stops=seqStops(S.pal,S.prev);
  const divergent=PAL[S.pal].kind==='div';
  const zero=sx(0);
  D.forEach(d=>{
    const x=sx(d.dev),y=sy(d.cat);
    const t=(d.dev/span+1)/2;
    const col=divergent?rampColor(stops,t):(d.dev>=0?rampColor(stops,0.78):rampColor(stops,0.22));
    E('rect',{x:Math.min(x,zero),y:y,width:Math.max(1,Math.abs(x-zero)),height:sy.bw,fill:col,rx:2,'class':'mark',
      'data-tip':d.cat+'\nvalor: '+fmtV(d.value,k)+'\nreferencia: '+fmtV(ref,k)+'\ndesvío: '+(d.dev>0?'+':'')+fmtV(d.dev,k)+'\n'+d.n+' país(es)'},f.g);
    T(f.g,-9,sy.mid(d.cat)+3.5,d.cat,'',{'text-anchor':'end','font-size':11});
    if(S.labels){
      const lab=(d.dev>0?'+':'')+fmtV(d.dev,k), w=lab.length*5.6;
      let lx=x+(d.dev>=0?6:-6), an=d.dev>=0?'start':'end';
      if(d.dev<0&&lx-w<2){lx=zero+6;an='start';}
      if(d.dev>=0&&lx+w>f.iw+m.r-2){lx=zero-6;an='end';}
      T(f.g,lx,sy.mid(d.cat)+3.5,lab,'dlabel',{'text-anchor':an});
    }
  });
  E('line',{x1:zero,x2:zero,y1:0,y2:f.ih,stroke:'var(--ink)','stroke-width':1.4},f.g);
  C.table([catLabel(S.cat),'Valor','Referencia','Desvío','Países'],D.map(d=>({[catLabel(S.cat)]:d.cat,Valor:fmtV(d.value,k),Referencia:fmtV(ref,k),'Desvío':(d.dev>0?'+':'')+fmtV(d.dev,k),'Países':d.n})));
  C.foot('Referencia: '+refLab+' = '+fmtV(ref,k)+'. Las barras miden la distancia a esa línea, no el valor absoluto.');
  C.warn('Acá el cero del eje es la referencia elegida, no el cero de la variable: la barra mide una diferencia. Cambiar la referencia (promedio, mediana, cero) reordena y reescala todo el gráfico.');
  if(!divergent)C.warn('Este gráfico tiene un punto neutro con significado: una paleta divergente con gris en el medio lo hace evidente de un vistazo.');
};
R.grouped=function(C){
  const S=C.S,{D,cxA,cxB,k}=crossAgg(C);
  if(!D.length)return C.empty();
  const vals=D.flatMap(d=>d.seg.map(s=>s.v)).filter(v=>v!=null);

  const m={t:16,r:16,b:D.length>5?84:52,l:66};

  const inner=band(cxB.dom,0,sx.bw,0.08);

        'data-tip':d.cat+'\n'+s.b+': '+fmtV(s.v,k)+'\n'+s.n+' país(es)'},f.g);
      if(S.labels&&inner.bw>24)T(f.g,sx(d.cat)+inner(s.b)+inner.bw/2,yv-5,fmtAxis(s.v,k),'dlabel',{'text-anchor':'middle'});

    E('line',{x1:sx(d.cat)-sx.step*0.12,x2:sx(d.cat)+sx.bw+sx.step*0.12,y1:f.ih+2,y2:f.ih+2,stroke:'var(--axis)','stroke-width':2},f.g);
