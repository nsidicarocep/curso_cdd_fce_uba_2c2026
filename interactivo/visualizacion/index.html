  C.table([catLabel(S.cat),catLabel(S.cat2),'Valor','Países'],tbl);
  C.foot(catLabel(S.cat)+' × '+catLabel(S.cat2)+', '+low(AGG[S.agg].lab)+' de '+low(NUMV[k].lab)+', '+S.year+'.');
  C.warn('Las barras agrupadas permiten comparar dentro de cada grupo con precisión, pero comparar la misma serie entre grupos obliga a saltear barras. Si eso es lo que importa, el dot plot de brechas o paneles chicos funcionan mejor.');
  C.warn('El agrupamiento tiene que verse: las barras de un mismo grupo van juntas y separadas del grupo siguiente. Si la separación interna y externa es igual, el lector no sabe qué se compara con qué.');
  if(cxB.dom.length>4)C.warn('Con '+cxB.dom.length+' series por grupo las barras se vuelven astillas. Pasado 3 o 4, conviene cambiar de forma.');
};

/* ══════════════ 13c. DISTRIBUCIÓN ACUMULADA Y DENSIDAD 2D ══════════════ */
R.ecdf=function(C){
  const S=C.S,k=S.num1,useLog=S.scaleX==='log'&&NUMV[k].log;
  const rows=C.rows.filter(r=>r[k]!=null&&isFinite(r[k])&&(!useLog||r[k]>0));
  if(rows.length<2)return C.empty();
  const cx=S.cat?catAxis(rows,S.cat):null;
  const groups=cx?cx.dom.filter(d=>rows.some(r=>cx.get(r)===d)):['Todos'];
  const vals=rows.map(r=>r[k]);
  const _e=EX(C,Math.min.apply(null,vals),Math.max.apply(null,vals));
  const m={t:16,r:16,b:50,l:60};
  const f=frame(C.host,C.h,m);
  const dm=padDom(_e[0],_e[1],useLog);
  const sx=numScale(dm[0],dm[1],0,f.iw,useLog);
  const sy=lin(0,1,f.ih,0);
  const gg=E('g',{'class':'tick'},f.g);
  for(const t of [0,0.25,0.5,0.75,1]){
    const y=sy(t);
    E('line',{x1:0,x2:f.iw,y1:y,y2:y,'class':'gridline'},gg);
    T(gg,-8,y+3.5,F(t*100,0)+'%','',{'text-anchor':'end'});
  }
  if(f.ih>170){const lt=T(f.g,0,0,'Proporción acumulada de países','axlabel',{'text-anchor':'middle'});
  lt.setAttribute('transform','translate(-48,'+(f.ih/2)+') rotate(-90)');}
  axXnum(f.g,sx,f.ih,NUMV[k].lab+' ('+NUMV[k].unit+')',k,6);
  const cm=cx?colorMap(groups,S):null;
  const tbl=[];
  groups.forEach(g=>{
    const col=cm?cm.get(g):'var(--accent)';
    const v=rows.filter(r=>!cx||cx.get(r)===g).map(r=>r[k]).sort((a,b)=>a-b);
    if(!v.length)return;
    const pts=[[sx(dm[0]),sy(0)]];
    v.forEach((x,i)=>{pts.push([sx(x),sy(i/v.length)]);pts.push([sx(x),sy((i+1)/v.length)]);});
    pts.push([sx(dm[1]),sy(1)]);
    E('path',{d:pathOf(pts),fill:'none',stroke:col,'stroke-width':2,'class':'mark',
      'data-tip':g+'\nn = '+v.length+'\nmediana '+fmtV(quantile(v,.5),k)},f.g);
    [0.25,0.5,0.75].forEach(q=>{
      const x=quantile(v,q);
      E('circle',{cx:sx(x),cy:sy(q),r:3.4,fill:'var(--surface)',stroke:col,'stroke-width':1.8,'class':'mark',
        'data-tip':g+'\npercentil '+F(q*100,0)+': '+fmtV(x,k)},f.g);
    });
    tbl.push({Grupo:g,n:v.length,P25:fmtV(quantile(v,.25),k),Mediana:fmtV(quantile(v,.5),k),P75:fmtV(quantile(v,.75),k)});
  });
  if(cx)C.legend(groups.map(g=>[g,cm.get(g)]));
  C.table(['Grupo','n','P25','Mediana','P75'],tbl);
  C.foot('Cada escalón es un país. La altura en un valor x es la proporción de países con un valor menor o igual. Los círculos marcan los cuartiles.'+(useLog?' Eje X logarítmico.':''));
  C.warn('No tiene ningún parámetro que elegir: a diferencia del histograma y de la densidad, no hay ancho de clase ni suavizado que puedan cambiar la conclusión. Es la representación más fiel de una distribución.');
  C.warn('A cambio, es menos intuitiva: las modas no se ven como picos sino como tramos empinados, y los tramos planos son huecos en los datos. Requiere explicarle al lector cómo se lee.');
};
R.hexbin=function(C){
  const S=C.S,kx=S.num1,ky=S.num2;
  const lx=S.scaleX==='log'&&NUMV[kx].log, ly=S.scaleY==='log'&&NUMV[ky].log;
  const rows=C.rows.filter(r=>r[kx]!=null&&r[ky]!=null&&isFinite(r[kx])&&isFinite(r[ky])&&(!lx||r[kx]>0)&&(!ly||r[ky]>0));
  if(!rows.length)return C.empty();
  const m={t:16,r:18,b:50,l:66};
  const f=frame(C.host,C.h,m);
  const xs=rows.map(r=>r[kx]),ys=rows.map(r=>r[ky]);
  const ex=EX(C,Math.min.apply(null,xs),Math.max.apply(null,xs),'x'), ey=EX(C,Math.min.apply(null,ys),Math.max.apply(null,ys),'y');
  const dx=padDom(ex[0],ex[1],lx), dy=padDom(ey[0],ey[1],ly);
  const sx=numScale(dx[0],dx[1],0,f.iw,lx), sy=numScale(dy[0],dy[1],f.ih,0,ly);
  axY(f.g,sy,f.iw,NUMV[ky].lab+' ('+NUMV[ky].unit+')',ky,6);
  axXnum(f.g,sx,f.ih,NUMV[kx].lab+' ('+NUMV[kx].unit+')',kx,6);
  const rad=Math.max(9,Math.min(26,f.iw/(+S.bins/1.6)));
  const dxh=rad*Math.sqrt(3), dyh=rad*1.5;
  const bins=new Map();
  rows.forEach(r=>{
    const px=sx(r[kx]), py=sy(r[ky]);
    let j=Math.round(py/dyh), i=Math.round(px/dxh-(j%2?0.5:0));
    const key=i+','+j;
    if(!bins.has(key))bins.set(key,{i,j,rows:[]});
    bins.get(key).rows.push(r);
  });
  const counts=[...bins.values()].map(b=>b.rows.length);
  const cmax=Math.max.apply(null,counts);
  const stops=seqStops(S.pal,S.prev);
  const hex=(cxp,cyp)=>{const p=[];for(let a=0;a<6;a++){const ang=Math.PI/180*(60*a-90);p.push([cxp+rad*Math.cos(ang),cyp+rad*Math.sin(ang)]);}return pathOf(p)+'Z';};
  [...bins.values()].forEach(b=>{
    const cxp=(b.i+(b.j%2?0.5:0))*dxh, cyp=b.j*dyh;
    const t=cmax>1?(b.rows.length-1)/(cmax-1):1;
    const names=b.rows.slice(0,6).map(r=>r.name).join(', ')+(b.rows.length>6?'…':'');
    E('path',{d:hex(cxp,cyp),fill:rampColor(stops,0.18+t*0.82),stroke:'var(--surface)','stroke-width':0.8,'class':'mark',
      'data-tip':b.rows.length+' país(es)\n'+names},f.g);
  });
  C.ramp(stops,'1 país',cmax+' países','Cantidad de países por celda');
  C.table(['Celda','Países','Casos'],[...bins.values()].sort((a,b)=>b.rows.length-a.rows.length).map(b=>({Celda:b.i+','+b.j,'Países':b.rows.length,Casos:b.rows.map(r=>r.name).join(', ')})));
  C.foot('n = '+rows.length+' países agrupados en '+bins.size+' celdas hexagonales. El tamaño de celda se controla con el deslizador de intervalos.');
  C.warn('Resuelve la superposición del diagrama de dispersión mostrando densidad en vez de puntos, pero pierde los casos individuales: no se puede señalar un país.');
  C.warn('El tamaño de la celda cumple el mismo papel que el ancho de clase del histograma: celdas grandes suavizan, celdas chicas vuelven al problema original.');
  if(rows.length<80)C.warn('Con solo '+rows.length+' casos no hay superposición que resolver: el diagrama de dispersión muestra más información con el mismo espacio.');
};

/* ══════════════ 13d. TRAYECTORIAS Y CONCENTRACIÓN ══════════════ */
R.connected=function(C){
  const S=C.S,kx=S.num1,ky=S.num2;
  const lx=S.scaleX==='log'&&NUMV[kx].log, ly=S.scaleY==='log'&&NUMV[ky].log;
  const y0=+S.y0,y1=+S.y1;
  const rows=applyFilters(panel(y0,y1),S);
  const cx=catAxis(rows,S.cat);
  const yrs=[]; for(let y=y0;y<=y1;y++)yrs.push(y);
  const byCat=new Map();
  rows.forEach(r=>{const c=cx.get(r); if(c==null)return; if(!byCat.has(c))byCat.set(c,new Map());
    const mm=byCat.get(c); if(!mm.has(r.year))mm.set(r.year,[]); mm.get(r.year).push(r);});
  let series=cx.dom.filter(c=>byCat.has(c)).map(c=>{
    const mm=byCat.get(c);
    const pts=yrs.map(y=>{
      const rs=mm.get(y)||[];
      const vx=rs.map(r=>r[kx]).filter(v=>v!=null&&isFinite(v)&&(!lx||v>0));
      const vy=rs.map(r=>r[ky]).filter(v=>v!=null&&isFinite(v)&&(!ly||v>0));
      if(!vx.length||!vy.length)return null;
      return {year:y, x:AGG[S.agg].f(vx,rs), y:AGG[S.agg].f(vy,rs)};
    }).filter(p=>p&&isFinite(p.x)&&isFinite(p.y));
    return {cat:c, pts};
  }).filter(s=>s.pts.length>1);
  if(!series.length)return C.empty();
  if(series.length>+S.topn)series=series.slice(0,+S.topn);
  const allx=series.flatMap(s=>s.pts.map(p=>p.x)), ally=series.flatMap(s=>s.pts.map(p=>p.y));
  const ex=EX(C,Math.min.apply(null,allx),Math.max.apply(null,allx),'x'), ey=EX(C,Math.min.apply(null,ally),Math.max.apply(null,ally),'y');
  const m={t:16,r:S.labels?110:20,b:50,l:66};
  const f=frame(C.host,C.h,m);
  const dx=padDom(ex[0],ex[1],lx), dy=padDom(ey[0],ey[1],ly);
  const sx=numScale(dx[0],dx[1],0,f.iw,lx), sy=numScale(dy[0],dy[1],f.ih,0,ly);
  axY(f.g,sy,f.iw,NUMV[ky].lab+' ('+NUMV[ky].unit+')',ky,6);
  axXnum(f.g,sx,f.ih,NUMV[kx].lab+' ('+NUMV[kx].unit+')',kx,6);
  const cm=colorMap(series.map(s=>s.cat),S);
  series.forEach(s=>{
    const col=cm.get(s.cat);
    const pts=s.pts.map(p=>[sx(p.x),sy(p.y)]);
    E('path',{d:pathOf(pts),fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-opacity':0.85,'class':'mark','data-tip':s.cat},f.g);
    s.pts.forEach((p,i)=>{
      const last=i===s.pts.length-1;
      E('circle',{cx:sx(p.x),cy:sy(p.y),r:last?5:(i===0?4:2.2),
        fill:last?col:(i===0?'var(--surface)':col),stroke:col,'stroke-width':last?1.2:1.6,'class':'mark',
        'data-tip':s.cat+'\n'+p.year+'\n'+NUMV[kx].lab+': '+fmtV(p.x,kx)+'\n'+NUMV[ky].lab+': '+fmtV(p.y,ky)},f.g);
    });
  });
  if(S.labels){
    const ends=series.map(s=>{const z=s.pts[s.pts.length-1];return {s:s,x:sx(z.x),y:sy(z.y)};});
    declutter(ends,13,0,f.ih-10).forEach(e=>T(f.g,e.x+9,e.y+3.5,e.s.cat,'dlabel',{}));
  }
  if(!S.labels)C.legend(series.map(s=>[s.cat,cm.get(s.cat)]));
  const tbl=[];
  series.forEach(s=>s.pts.forEach(p=>tbl.push({Serie:s.cat,'Año':p.year,[NUMV[kx].lab]:fmtV(p.x,kx),[NUMV[ky].lab]:fmtV(p.y,ky)})));
  C.table(['Serie','Año',NUMV[kx].lab,NUMV[ky].lab],tbl);
  C.foot('Trayectoria '+y0+'–'+y1+'. El círculo hueco es el primer año, el lleno el último. '+AGG[S.agg].lab.toLowerCase()+' por '+low(catLabel(S.cat))+'.');
  C.warn('El tiempo no tiene eje propio: avanza a lo largo de la línea. Hay que marcar el inicio, el final y el sentido, o el lector no sabe hacia dónde se mueve.');
  C.warn('Si la trayectoria se enrosca sobre sí misma, el gráfico deja de leerse. Funciona con pocas series y un recorrido relativamente ordenado.');
  if(series.length>5)C.warn('Con '+series.length+' trayectorias superpuestas conviene pasar a paneles chicos: una trayectoria por panel.');
};
R.lorenz=function(C){
  const S=C.S,k=S.num1;
  const rows=C.rows.filter(r=>r[k]!=null&&isFinite(r[k])&&r[k]>0&&r.pop>0);
  if(rows.length<3)return C.empty();
  const cx=S.cat?catAxis(rows,S.cat):null;
  const groups=cx?cx.dom.filter(d=>rows.filter(r=>cx.get(r)===d).length>2):['Todos'];
  const m={t:16,r:16,b:50,l:60};
  const f=frame(C.host,Math.min(C.h,520),m);
  const side=Math.min(f.iw,f.ih);
  const sx=lin(0,1,0,side), sy=lin(0,1,side,0);
  const gg=E('g',{'class':'tick'},f.g);
  for(const t of [0,0.25,0.5,0.75,1]){
    E('line',{x1:0,x2:side,y1:sy(t),y2:sy(t),'class':'gridline'},gg);
    E('line',{x1:sx(t),x2:sx(t),y1:0,y2:side,'class':'gridline'},gg);
    T(gg,-8,sy(t)+3.5,F(t*100,0)+'%','',{'text-anchor':'end'});
    T(gg,sx(t),side+17,F(t*100,0)+'%','',{'text-anchor':'middle'});
  }
  E('line',{x1:0,x2:side,y1:side,y2:0,stroke:'var(--ink)','stroke-width':1.4,'stroke-dasharray':'5 4'},f.g);
  T(f.g,side-6,sy(1)+16,'igualdad perfecta','dlabel',{'text-anchor':'end'});
  if(side>230){
    T(f.g,side/2,side+36,'Proporción acumulada de la población','axlabel',{'text-anchor':'middle'});
    const lt=T(f.g,0,0,'Proporción acumulada de '+low(NUMV[k].lab),'axlabel',{'text-anchor':'middle'});
    lt.setAttribute('transform','translate(-46,'+(side/2)+') rotate(-90)');
  }
  const cm=cx?colorMap(groups,S):null;
  const tbl=[];
  groups.forEach(g=>{
    const col=cm?cm.get(g):'var(--accent)';
    const sub=rows.filter(r=>!cx||cx.get(r)===g).slice().sort((a,b)=>a[k]-b[k]);
    if(sub.length<3)return;
    const totP=sum(sub.map(r=>r.pop)), totV=sum(sub.map(r=>r[k]*r.pop));
    let cp=0,cv=0,gini=0,prevP=0,prevV=0;
    const pts=[[sx(0),sy(0)]];
    sub.forEach(r=>{
      cp+=r.pop/totP; cv+=r[k]*r.pop/totV;
      gini+=(cp-prevP)*(cv+prevV);
      prevP=cp; prevV=cv;
      pts.push([sx(cp),sy(cv)]);
    });
    gini=1-gini;
    E('path',{d:pathOf(pts),fill:col,'fill-opacity':groups.length>1?0:0.14,stroke:'none'},f.g);
    E('path',{d:pathOf(pts),fill:'none',stroke:col,'stroke-width':2.2,'class':'mark',
      'data-tip':g+'\n'+sub.length+' países\nGini entre países: '+F(gini,3)},f.g);
    [0.1,0.5,0.9].forEach(q=>{
      let a=0,b=0;
      for(const r of sub){if(a>=q)break;a+=r.pop/totP;b+=r[k]*r.pop/totV;}
      E('circle',{cx:sx(a),cy:sy(b),r:3.4,fill:'var(--surface)',stroke:col,'stroke-width':1.8,'class':'mark',
        'data-tip':g+'\nel '+F(a*100,0)+' % más bajo de la población\nconcentra el '+F(b*100,1)+' % del total'},f.g);
    });
    tbl.push({Grupo:g,'Países':sub.length,'Gini entre países':F(gini,3)});
  });
  if(cx)C.legend(groups.map(g=>[g,cm.get(g)]));
  C.table(['Grupo','Países','Gini entre países'],tbl);
  C.foot('Países ordenados de menor a mayor '+low(NUMV[k].lab)+' y ponderados por población. El eje vertical acumula '+low(NUMV[k].lab)+' × población.');
  C.warn('Este Gini mide la desigualdad ENTRE países tratando a cada país como homogéneo: ignora por completo la desigualdad interna. No es comparable con el Gini de los WDI, que se calcula entre hogares.');
  C.warn('La curva solo tiene sentido si la variable es positiva y acumulable después de multiplicarla por la población. Con tasas, porcentajes o variables que pueden ser negativas, el resultado no se interpreta.');
};

R.stream=function(C){
  const S=C.S,{series,yrs,k}=tsData(C);
  if(!series.length)return C.empty();
  const m={t:16,r:18,b:46,l:66};
  const f=frame(C.host,C.h,m);
  const totals=yrs.map((y,i)=>sum(series.map(s=>s.pts[i].value||0))||0);
  const _e=EX(C,0,Math.max.apply(null,totals));
  const sy=lin(-_e[1]/2*1.08,_e[1]/2*1.08,f.ih,0);
  const sx=lin(yrs[0],yrs[yrs.length-1],0,f.iw);
  axY(f.g,sy,f.iw,AGG[S.agg].lab+' de '+NUMV[k].lab,k,5);
  const gg=E('g',{'class':'tick'},f.g);
  const stepY=Math.max(1,Math.ceil(yrs.length/Math.max(2,Math.floor(f.iw/46))));
  yrs.filter((y,i)=>(i%stepY===0&&yrs.length-1-i>=stepY)||i===yrs.length-1).forEach(y=>{const x=sx(y);
    E('line',{x1:x,x2:x,y1:0,y2:f.ih,'class':'gridline'},gg);
    T(gg,x,f.ih+17,String(y),'',{'text-anchor':'middle'});});
  const cm=colorMap(series.map(s=>s.cat),S);
  const acc=yrs.map((y,i)=>-totals[i]/2);
  series.forEach(s=>{
    const top=[],bot=[];
    yrs.forEach((y,i)=>{const v=s.pts[i].value||0;bot.push([sx(y),sy(acc[i])]);acc[i]+=v;top.push([sx(y),sy(acc[i])]);});
    E('path',{d:pathOf(top)+'L'+bot.reverse().map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L')+'Z',
      fill:cm.get(s.cat),'fill-opacity':0.9,stroke:'var(--surface)','stroke-width':0.8,'class':'mark','data-tip':s.cat},f.g);
  });
  C.legend(series.slice().reverse().map(s=>[s.cat,cm.get(s.cat)]));
  const tbl=[];
  series.forEach(s=>s.pts.forEach(p=>{if(p.value!=null)tbl.push({Serie:s.cat,'Año':p.year,Valor:fmtV(p.value,k)});}));
  C.table(['Serie','Año','Valor'],tbl);
  C.foot('Mismas bandas que el área apilada, centradas sobre una base móvil en lugar de apoyarse en el cero.');
  C.warn('Al mover la base, ninguna banda tiene línea de referencia: ni siquiera la de abajo. Se lee la silueta del total y poco más; cualquier lectura por serie es insegura.');
  C.warn('Es un gráfico decorativo. Sirve para mostrar que algo creció o cambió de composición en una pieza visual, no para que el lector extraiga valores. El eje vertical, además, no tiene cero.');
};
R.radar=function(C){
  const S=C.S;
  const ks=S.multi.length>2?S.multi:['gdppc','life','internet','urban','fert'];
  const cx=catAxis(C.rows,S.cat);
  const D=cx.dom.map(c=>{
    const rs=C.rows.filter(r=>cx.get(r)===c);
    const o={cat:c, n:rs.length, v:{}};
    ks.forEach(k=>{const vals=rs.map(r=>r[k]).filter(v=>v!=null&&isFinite(v));o.v[k]=vals.length?AGG[S.agg].f(vals,rs):null;});
    return o;
  }).filter(d=>ks.some(k=>d.v[k]!=null)).slice(0,+S.topn);
  if(!D.length)return C.empty();
  const ext={};
  ks.forEach(k=>{const v=D.map(d=>d.v[k]).filter(x=>x!=null);ext[k]=[Math.min.apply(null,v),Math.max.apply(null,v)];});
  const W=Math.max(300,Math.floor(C.host.clientWidth||680)), H=Math.min(C.h,480);
  C.host.innerHTML='';
  const svg=E('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img'},C.host);
  const cxp=W/2, cyp=H/2+6, rad=Math.min(W,H)/2-54;
  const ang=i=>Math.PI*2*i/ks.length-Math.PI/2;
  [0.25,0.5,0.75,1].forEach(t=>{
    const p=ks.map((k,i)=>[cxp+Math.cos(ang(i))*rad*t, cyp+Math.sin(ang(i))*rad*t]);
    E('path',{d:pathOf(p)+'Z',fill:'none',stroke:'var(--grid)','stroke-width':1},svg);
  });
  ks.forEach((k,i)=>{
    E('line',{x1:cxp,y1:cyp,x2:cxp+Math.cos(ang(i))*rad,y2:cyp+Math.sin(ang(i))*rad,stroke:'var(--axis)','stroke-width':1},svg);
    const lx=cxp+Math.cos(ang(i))*(rad+18), ly=cyp+Math.sin(ang(i))*(rad+18);
    T(svg,lx,ly+3.5,NUMV[k].lab,'dlabel',{'text-anchor':Math.abs(Math.cos(ang(i)))<0.3?'middle':(Math.cos(ang(i))>0?'start':'end'),'font-size':10.5});
  });
  const cm=colorMap(D.map(d=>d.cat),S);
  D.forEach(d=>{
    const col=cm.get(d.cat);
    const p=ks.map((k,i)=>{
      const e=ext[k], t=d.v[k]==null?0:(e[1]===e[0]?0.5:(d.v[k]-e[0])/(e[1]-e[0]))*0.88+0.12;
      return [cxp+Math.cos(ang(i))*rad*t, cyp+Math.sin(ang(i))*rad*t];
    });
    E('path',{d:pathOf(p)+'Z',fill:col,'fill-opacity':0.16,stroke:col,'stroke-width':2,'class':'mark',
      'data-tip':d.cat+'\n'+ks.map(k=>NUMV[k].lab+': '+fmtV(d.v[k],k)).join('\n')},svg);
    p.forEach(q=>E('circle',{cx:q[0],cy:q[1],r:3,fill:col},svg));
  });
  C.legend(D.map(d=>[d.cat,cm.get(d.cat)]));
  C.table([catLabel(S.cat)].concat(ks.map(k=>NUMV[k].lab)),D.map(d=>{const o={[catLabel(S.cat)]:d.cat};ks.forEach(k=>o[NUMV[k].lab]=fmtV(d.v[k],k));return o;}));
  C.foot('Cada eje está normalizado entre el mínimo y el máximo de las categorías mostradas: el centro no es cero y la escala es distinta en cada eje.');
  C.warn('El área del polígono no significa nada: depende del orden en que se pusieron los ejes. Reordenar los ejes cambia la forma sin cambiar un solo dato.');
  C.warn('Las variables con sentido invertido (fecundidad, mortalidad) hacen que «más grande» no sea «mejor» en todos los ejes. El lector asume lo contrario.');
  C.warn('Un dot plot o unas barras agrupadas por variable transmiten lo mismo con comparaciones mucho más precisas. Este gráfico está acá para poder discutirlo.');
};

function ctl(label,inner,forKey){
  return '<div class="ctl"'+(forKey?' data-for="'+forKey+'"':'')+'><label for="'+(inner.match(/id="([^"]+)"/)||[])[1]+'">'+label+'</label>'+inner+'</div>';
}
function rngCtl(label,id,min,max,step,val,forKey){
  return '<div class="ctl" data-for="'+forKey+'"><label for="'+id+'">'+label+'</label><div class="rangerow"><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"><output id="o-'+id+'">'+val+'</output></div></div>';
}
function syncOut(el){const o=document.getElementById('o-'+el.id);if(o)o.textContent=el.value;}
function fillTypes(){
  const fam=document.getElementById('c-fam').value;
  const sel=document.getElementById('c-type');
  const list=CHARTS.filter(c=>c.fam===fam);
  if(!list.length)return;
  sel.innerHTML=opts(list.map(c=>[c.id,c.name]),list.some(c=>c.id===ST.type)?ST.type:list[0].id);
}
function fillCats(){
  const spec=CHARTBY[document.getElementById('c-type').value]||CHARTBY[ST.type];
  const mode=spec.catMode||'group';
  const optional=spec.ctl.indexOf('cat?')>=0;
  const base=catOptions(mode);
  const s1=document.getElementById('c-cat'), s2=document.getElementById('c-cat2');
  const l1=(optional?[['','(sin agrupar)']]:[]).concat(base);
  s1.innerHTML=opts(l1,ST.cat);
  if(!l1.some(o=>String(o[0])===String(ST.cat)))s1.value=l1[optional?1:0][0];
  s2.innerHTML=opts(base.filter(o=>o[0]!==s1.value),ST.cat2);
  if(!s2.querySelector('option[value="'+ST.cat2+'"]'))s2.value=s2.options[0]?s2.options[0].value:'';
}
function readState(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  const gc=id=>{const e=document.getElementById(id);return e?e.checked:false;};
  const S=Object.assign({},ST);
  S.type=g('c-type')||ST.type;
  ['num1','num2','num3','cat','cat2','year','year2','y0','y1','agg','topn','pal','sort','scaleX','scaleY','bins','bw','jitter','overlap','fregion','fincome','fpop','ref','facet'].forEach(k=>{const v=g('c-'+k);if(v!=null)S[k]=v;});
  ['prev','zero','labels','trend','points','fill','shared'].forEach(k=>S[k]=gc('c-'+k));
  const ms=document.getElementById('c-multi');
  if(ms)S.multi=[...ms.selectedOptions].map(o=>o.value);
  if(+S.y1<+S.y0){const t=S.y0;S.y0=S.y1;S.y1=t;}
  const spec=CHARTBY[S.type];
  if(spec.ctl.indexOf('cat?')>=0&&!S.cat)S.cat='';
  if(spec.ctl.indexOf('cat')>=0&&!S.cat)S.cat='region';
  if(spec.ctl.indexOf('cat2')>=0&&(!S.cat2||S.cat2===S.cat))S.cat2=(S.cat==='income')?'region':'income';
  if(spec.ctl.indexOf('aggsum')>=0&&['mean','wmean','median','min','max','p25','p75','sd'].indexOf(S.agg)>=0)S.agg='sum';
  return S;
}
function onChange(e){
  if(e.target.id==='c-fam'){fillTypes();ST.type=document.getElementById('c-type').value;fillCats();}
  if(e.target.id==='c-type'){ST.type=e.target.value;fillCats();}
  if(e.target.id==='c-cat'){ST.cat=e.target.value;fillCats();}
  if(e.target.id==='c-cat2')ST.cat2=e.target.value;
  draw();
}
function applyVisibility(spec){
  const used=new Set();
  spec.ctl.forEach(c=>{
    if(c==='cat?')used.add('cat');
    else if(c==='aggsum')used.add('agg');
    else if(c==='year2'){used.add('year2');used.add('year');}
    else used.add(c);
  });
  if(!used.has('range'))used.add('year');
  document.querySelectorAll('#controls [data-for]').forEach(el=>{
    el.classList.toggle('hidden',!used.has(el.getAttribute('data-for')));
  });
}

let LASTTABLE={cols:[],rows:[]};
function panelH(host){return Math.max(360,Math.min(520,Math.round((host.clientWidth||680)*0.62)));}
function mkC(S,host,h,rows,sink,ext){
  return {
    S:S, host:host, h:h, rows:rows, ext:ext,
    warn:t=>{if(sink.warns.indexOf(t)<0)sink.warns.push(t);},
    table:(cols,rows2)=>{
      if(!sink.table.cols.length)sink.table={cols:(sink.panel?['Panel'].concat(cols):cols),rows:[]};
      rows2.forEach(r=>sink.table.rows.push(sink.panel?Object.assign({Panel:sink.panel},r):r));
    },
    legend:items=>{if(sink.legend)return;sink.legend={cls:'legend',html:items.map(i=>'<span><i style="background:'+i[1]+'"></i>'+i[0]+'</span>').join('')};},
    ramp:(stops,loL,hiL,label)=>{if(sink.legend)return;sink.legend={cls:'rampbox',
      html:'<span>'+label+'</span><span>'+loL+'</span><div class="ramp" style="background:linear-gradient(to right,'+stops.join(',')+')"></div><span>'+hiL+'</span>'};},
    foot:t=>{if(!sink.foot)sink.foot=t;},
    empty:()=>{host.innerHTML='<div class="loading">No hay datos suficientes con esta combinación de variables, año y filtros. Probá otro año, otra agrupación o quitá filtros.</div>';}
  };
}
function runChart(S,C){
  try{ R[S.type](C); C.host.querySelectorAll('svg').forEach(fitSvg); }
  catch(err){ C.host.innerHTML='<div class="loading">No se pudo dibujar esta combinación ('+err.message+'). Cambiá alguna opción.</div>'; }
}
function drawFacets(S,spec,plot,sink){
  const refYear=spec.ctl.indexOf('range')>=0?S.y1:S.year;
  FACET=null;
  const base=applyFilters(crossSection(refYear),S);
  const fx=catAxis(base,S.facet);
  const map=new Map(); base.forEach(r=>map.set(r.iso,fx.get(r)));
  const levels=fx.dom.filter(lv=>base.some(r=>map.get(r.iso)===lv));
  if(levels.length<2){FACET=null;return false;}
  plot.innerHTML='';
  const grid=document.createElement('div'); grid.className='facets';
  const panels=levels.map(lv=>{
    const wrap=document.createElement('div'); wrap.className='facet';
    const t=document.createElement('p'); t.className='ftitle'; t.textContent=lv;
    const body=document.createElement('div'); body.className='fbody';
    wrap.appendChild(t); wrap.appendChild(body); grid.appendChild(wrap);
    return {lv:lv, body:body};
  });
  plot.appendChild(grid);
  const h=Math.max(185,Math.min(250,Math.round((panels[0].body.clientWidth||260)*0.78)));
  const store={};
  const collect=(lo,hi,slot)=>{slot=slot||'v';
    const st=store[slot]||(store[slot]={lo:Infinity,hi:-Infinity});
    if(isFinite(lo))st.lo=Math.min(st.lo,lo);
    if(isFinite(hi))st.hi=Math.max(st.hi,hi);
    return [lo,hi];};
  const apply=(lo,hi,slot)=>{slot=slot||'v';const st=store[slot];
    return (st&&isFinite(st.lo)&&isFinite(st.hi)&&st.hi>st.lo)?[st.lo,st.hi]:[lo,hi];};
  const mute={warns:[],table:{cols:[],rows:[]},legend:null,foot:'',panel:null};
  if(S.shared){
    panels.forEach(p=>{
      FACET={map:map,level:p.lv};
      runChart(S,mkC(S,p.body,h,applyFilters(crossSection(S.year),S),mute,collect));
    });
  }
  panels.forEach(p=>{
    FACET={map:map,level:p.lv};
    sink.panel=p.lv;
    runChart(S,mkC(S,p.body,h,applyFilters(crossSection(S.year),S),sink,S.shared?apply:null));
  });
  sink.panel=null;
  FACET=null;
  sink.warns.unshift(levels.length+' paneles, uno por cada categoría de '+low(catLabel(S.facet))+'. '+
    (S.shared?'Todos comparten la misma escala: por eso una barra más alta significa lo mismo en cualquier panel. Apagá la opción y mirá qué pasa.'
            :'Cada panel tiene su propia escala, así que las alturas NO son comparables entre paneles. Es la forma más común de arruinar unos small multiples.'));
  sink.warns.push('Los paneles repiten la misma forma, el mismo orden y el mismo color. Eso es lo que permite que el ojo salte de uno a otro sin volver a aprender el gráfico en cada panel.');
  return true;
}
function draw(){
  const S=readState();
  const spec=CHARTBY[S.type];
  applyVisibility(spec);
  const plot=document.getElementById('plot');
  const legendEl=document.getElementById('legend');
  legendEl.innerHTML=''; legendEl.className='';
  document.getElementById('warns').innerHTML='';
  const sink={warns:[],table:{cols:[],rows:[]},legend:null,foot:'',panel:null};
  FACET=null;
  let faceted=false;
  if(S.facet&&S.facet!=='none'){
    if(S.facet===S.cat)sink.warns.push('Los paneles usan la misma variable que ya agrupa el gráfico, así que cada panel tendría una sola categoría. Elegí otra variable para los paneles.');
    else{
      faceted=drawFacets(S,spec,plot,sink);
      if(!faceted)sink.warns.push('Con los filtros actuales queda una sola categoría de '+low(catLabel(S.facet))+': no hay nada que dividir en paneles.');
    }
  }
  if(!faceted){
    plot.innerHTML='';
    runChart(S,mkC(S,plot,panelH(plot),applyFilters(crossSection(S.year),S),sink,null));
  }
  LASTTABLE=sink.table;
  if(sink.legend){legendEl.className=sink.legend.cls;legendEl.innerHTML=sink.legend.html;}
  document.getElementById('cfam').textContent=spec.fam;
  document.getElementById('ctitle').textContent=chartTitle(S,spec);
  document.getElementById('csub').textContent=chartSub(S,spec);
  const warns=sink.warns;
  const missing=missingNote(S,spec);
  if(missing)warns.unshift(missing);
  if(PAL[S.pal].bad&&!warns.some(w=>w.indexOf('arcoíris')>=0))
    warns.push('La paleta arcoíris no es perceptualmente uniforme: inventa saltos donde el tono cambia rápido y aplana donde cambia poco. Está acá para que compares, no para usarla.');
  if(PAL[S.pal].kind!=='cat'&&spec.prefer==='cat'&&(S.cat||spec.ctl.indexOf('cat')>=0))
    warns.push('Estás usando una paleta secuencial o divergente para categorías sin orden. Funciona si las categorías sí tienen orden (grupos de ingreso, terciles); si no lo tienen, sugiere una jerarquía inexistente.');
  if(PAL[S.pal].kind==='cat'&&spec.prefer==='div')
    warns.push('Esta variable tiene un punto neutro con significado: una paleta divergente con gris en el medio lo hace visible de un vistazo.');
  document.getElementById('warns').innerHTML=warns.length?'<p class="warnhead">Avisos sobre la construcción del gráfico</p>'+warns.map(w=>'<div class="warn"><span class="ic">!</span><span>'+w+'</span></div>').join(''):'';
  const foot=document.getElementById('cfoot');
  foot.innerHTML='';
  const src=document.createElement('span'); src.innerHTML='<b>Fuente:</b> World Development Indicators, Banco Mundial.'; foot.appendChild(src);
  if(sink.foot){const n=document.createElement('span'); n.textContent='Nota: '+sink.foot.trim(); foot.appendChild(n);}
  renderNote(spec);
  renderDataTab();
}
function low(s){return /^[A-ZÁÉÍÓÚÑ]{2}/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1);}
function chartTitle(S,spec){
  const k=NUMV[S.num1]?NUMV[S.num1].lab:'';
  if(spec.id==='corr')return 'Matriz de correlaciones';
  if(spec.id==='mosaic')return catLabel(S.cat)+' y '+catLabel(S.cat2).toLowerCase();
  if(spec.id==='parallel')return 'Perfil multivariado de los países';
  if(spec.id==='gap')return 'Desvío de '+low(k)+' por '+low(catLabel(S.cat));
  if(spec.id==='ecdf')return 'Distribución acumulada de '+low(k);
  if(spec.id==='lorenz')return 'Concentración de '+low(k)+' entre países';
  if(spec.id==='radar')return 'Perfil multivariado por '+low(catLabel(S.cat));
  if(['scatter','bubble','hexbin','connected'].indexOf(spec.id)>=0)return NUMV[S.num2].lab+' y '+low(k);
  if(['heatmap','stackbar','stack100','cleveland','grouped'].indexOf(spec.id)>=0)return k+' por '+low(catLabel(S.cat))+' y '+low(catLabel(S.cat2));
  if(spec.ctl.indexOf('cat')>=0||S.cat)return k+' por '+low(catLabel(S.cat||'region'));
  return 'Distribución de '+low(k);
}
function chartSub(S,spec){
  const t=[];
  t.push(spec.name);
  if(spec.ctl.indexOf('range')>=0)t.push(S.y0+'–'+S.y1);
  else if(spec.ctl.indexOf('year2')>=0)t.push(Math.min(+S.year,+S.year2)+' y '+Math.max(+S.year,+S.year2));
  else t.push(String(S.year));
  if(S.fregion!=='all')t.push(S.fregion);
  if(S.fincome!=='all')t.push(S.fincome);
  if(S.fpop!=='0')t.push('población ≥ '+fmtV(+S.fpop,'pop'));
  return t.join(' · ');
}
function missingNote(S,spec){
  if(spec.ctl.indexOf('range')>=0||spec.id==='corr'||spec.id==='mosaic')return null;
  const all=applyFilters(crossSection(S.year),S);
  const keys=[S.num1];
  if(spec.ctl.indexOf('num2')>=0)keys.push(S.num2);
  if(spec.ctl.indexOf('num3')>=0)keys.push(S.num3);
  const ok=all.filter(r=>keys.every(k=>r[k]!=null&&isFinite(r[k])));
  const miss=all.length-ok.length;
  if(!miss)return null;
  return miss+' de '+all.length+' países quedan fuera del gráfico por falta de dato en '+keys.map(k=>low(NUMV[k].lab)).join(' o ')+' en '+S.year+'. Los faltantes no son aleatorios: suelen concentrarse en los países más pobres o más chicos.';
}
function renderNote(spec){
  const m=METHOD[spec.id]||{};
  document.getElementById('note').innerHTML=
    '<div><dt>'+spec.name+'</dt><dd>'+(m.use||'')+'</dd></div>'+
    '<div><dt>Qué se puede leer</dt><dd>'+(m.read||'')+'</dd></div>'+
    '<div><dt>Qué puede fallar</dt><dd>'+(m.prob||'')+'</dd></div>'+
    '<div><dt>Alternativas</dt><dd>'+(m.alt||'')+'</dd></div>';
}

function renderDataTab(){
  const host=document.getElementById('pane-datos');
  const {cols,rows}=LASTTABLE;
  if(!cols.length){host.innerHTML='<div class="loading">Elegí un gráfico en la pestaña «Explorar» y acá vas a ver la tabla que lo alimenta.</div>';return;}
  const cap=rows.slice(0,600);
  host.innerHTML='<div class="datahead"><div><h2 style="font-family:var(--serif);font-size:19px;margin:0">Datos que alimentan el gráfico</h2>'+
    '<p class="sub" style="margin:4px 0 0">'+rows.length+' filas'+(rows.length>cap.length?' (se muestran las primeras '+cap.length+')':'')+' · cada gráfico es una tabla; esta es la suya.</p></div>'+
    '<button class="btn" id="copybtn">Copiar como TSV</button></div>'+
    '<div class="tablewrap" style="max-height:70vh;overflow-y:auto"><table><thead><tr>'+
    cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+
    cap.map(r=>'<tr>'+cols.map((c,i)=>'<td class="'+(i===0?'t':'num')+'">'+(r[c]==null?'—':r[c])+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>';
  document.getElementById('copybtn').addEventListener('click',function(){
    const tsv=[cols.join('\t')].concat(rows.map(r=>cols.map(c=>r[c]==null?'':r[c]).join('\t'))).join('\n');
    const btn=this;
    try{navigator.clipboard.writeText(tsv).then(()=>{btn.textContent='Copiado';setTimeout(()=>btn.textContent='Copiar como TSV',1600);},
      ()=>{btn.textContent='No se pudo copiar';});}
    catch(e){btn.textContent='No se pudo copiar';}
  });
}

  alt:'Barras agrupadas, paneles chicos, tabla con el n al lado de cada valor.'},
 mosaic:{use:'Cruzar dos variables cualitativas mostrando al mismo tiempo el tamaño de cada grupo y su composición interna.',

/* ══════════════ 20. ADVERTENCIAS GENERALES ══════════════ */
const CAVEATS=[
 ['Small multiples','Repetir el mismo gráfico chico, una vez por grupo, suele ser mejor que amontonar todo en un solo panel. La condición es que todos los paneles compartan escala, forma, orden y color: si cada panel tiene su propio eje, las comparaciones entre paneles son falsas y el gráfico engaña más que uno saturado.'],
 ['Resaltar en vez de colorear todo','Cuando hay muchas series, darle un color a cada una no comunica nada. Pintar una o dos en color y el resto en gris claro dice qué hay que mirar, y conserva el contexto.'],
 ['Ordená los datos','Con categorías sin orden natural, ordenarlas por valor es casi siempre la mejor decisión: convierte el gráfico en un ranking legible. El orden alfabético solo se justifica si el lector va a buscar una categoría puntual.'],
 ['¿Cortar el eje o no?','En barras, el eje debe arrancar en cero: la longitud codifica el valor y recortarla exagera las diferencias. En líneas y puntos el eje puede recortarse, porque lo que importa es la forma del cambio, pero el recorte sigue siendo una decisión que hay que declarar.'],
 ['Cómo se lee una escala logarítmica','En escala log, distancias iguales son razones iguales. Es la escala adecuada para variables que se extienden por órdenes de magnitud, como el PIB per cápita o la población. En series de tiempo, pendientes iguales significan tasas de crecimiento iguales.'],
 ['Nunca dos ejes verticales','Con dos escalas distintas se puede hacer que dos series coincidan o se separen a voluntad: el cruce de las líneas no significa nada. Si hay que comparar dos variables de escalas distintas, usá dos gráficos o indexá a una base común.'],
 ['El gráfico espagueti','Más de seis u ocho líneas en un mismo gráfico son imposibles de seguir. Resaltá una o dos y dejá el resto en gris de fondo, o pasá a paneles chicos.'],
 ['El problema de apilar','Solo el segmento que apoya en la base tiene una referencia recta. Los segmentos superiores se mueven arrastrados por los de abajo, así que no se puede leer su tendencia. Poné en la base la serie que más importa comparar.'],
 ['El tamaño del bin cambia la historia','Histogramas y densidades dependen de un parámetro de suavizado que el autor elige. Antes de concluir que una distribución es bimodal, probá tres o cuatro valores distintos.'],
 ['¿La caja esconde información?','El diagrama de caja resume cinco números y no muestra el tamaño de la muestra ni la forma de la distribución. Con pocos casos, mostrar los puntos es más honesto.'],
 ['Superposición de puntos','En un diagrama de dispersión con muchos casos, los puntos se tapan y la densidad real queda oculta. Transparencia, puntos más chicos, hexbins o densidad 2D son las salidas.'],
 ['Área o radio','Cuando el tamaño codifica un valor, debe ser proporcional al área, no al radio: si no, duplicar el valor cuadruplica la mancha. Y aun bien hecha, el área se decodifica con mucho error.'],
 ['La paleta arcoíris','El arcoíris no es perceptualmente uniforme: crea fronteras falsas donde el tono cambia rápido y aplana zonas donde cambia poco. Para magnitudes, usá una secuencial de un solo tono (azules, rosas) o Viridis. Está en esta página para que puedas verlo.'],
 ['Secuencial, divergente o categórica','Categórica para identidad sin orden; secuencial de un tono para magnitud; divergente con gris en el medio solo cuando hay un punto neutro con significado (cero, un promedio, una meta). Usar la paleta equivocada inventa un orden o esconde el neutro.'],
 ['El color nunca solo','Alrededor del 8 % de los varones tiene alguna deficiencia en la visión del color. Si la identidad de una serie depende únicamente del tono, para esos lectores el gráfico no existe. Etiquetas directas, formas distintas o una tabla al lado resuelven el problema.'],
 ['Los datos faltantes no son aleatorios','En los WDI, los países que faltan suelen ser los más pobres, los más chicos o los que están en conflicto. Un gráfico que los omite en silencio muestra un mundo sistemáticamente más rico que el real. Esta página cuenta siempre cuántos países quedaron afuera.'],
 ['Promedio simple o ponderado','El promedio simple entre países le da el mismo peso a Islandia y a China. El ponderado por población responde una pregunta distinta: cómo le va a la persona promedio, no al país promedio. Ninguno es «el correcto»: son dos preguntas.'],
 ['La paradoja de Simpson','Una relación que aparece entre agregados nacionales puede invertirse al mirar dentro de cada país, o al separar por grupos. Antes de concluir, probá colorear por grupo de ingreso o filtrar por región.'],
 ['No sumes tasas','Las tasas y los promedios no se suman. La suma de las esperanzas de vida de siete regiones no significa nada: para agregarlas hay que ponderar por población.'],
 ['Elegí la unidad de observación','Acá cada caso es un país-año, no una persona. Todas las conclusiones son sobre países. La misma pregunta medida sobre personas puede dar otro resultado.'],
 ['Anotá el gráfico','Un título que describa qué se está viendo, la fuente, las unidades y el n hacen la diferencia entre un gráfico utilizable y una imagen linda. Si hay un punto que importa, señalalo en el propio gráfico.'],
 ['Quitá lo que no informa','Grillas pesadas, efectos 3D, sombras, degradados decorativos y colores que no codifican nada compiten con los datos. El 3D además distorsiona: nunca lo uses para representar valores.']
];

/* ══════════════ 21. PESTAÑA METODOLÓGICA ══════════════ */
function renderMethod(){
  const h=[];
  h.push('<div><h2>Cómo elegir un gráfico</h2>',
   '<p class="lede">El tipo de gráfico no se elige por gusto: se elige por el trabajo que tienen que hacer los datos. ',
   'Una magnitud por categoría pide longitud; una distribución pide forma; una relación pide posición en dos ejes; una composición pide partes de un todo; ',
   'una evolución pide un eje temporal continuo. Cambiá el gráfico en la pestaña «Explorar» con las mismas variables y vas a ver cómo cada forma hace visible una cosa y esconde otra.</p></div>');

  h.push('<div><h3>Qué pide cada combinación de variables</h3><div class="tablewrap"><table><thead><tr><th>Datos</th><th>Primeras opciones</th><th>Para muchos casos o muchos grupos</th></tr></thead><tbody>');
  [['1 cuantitativa','Histograma, densidad','Caja o violín si hay que resumir'],
   ['1 cuantitativa + 1 cualitativa','Barras, bastones','Caja, violín, crestas, enjambre'],
   ['2 cuantitativas','Dispersión','Densidad 2D, hexbins, paneles chicos'],
   ['3 cuantitativas','Burbujas, dispersión con color','Dos gráficos separados'],
   ['Varias cuantitativas','Correlograma, coordenadas paralelas','Componentes principales, mapa de calor'],
   ['1 cualitativa (partes de un todo)','Barras ordenadas, waffle','Treemap, barras apiladas'],
   ['2 cualitativas','Barras apiladas al 100 %, mapa de calor','Mosaico, tabla de contingencia'],
   ['Cuantitativa en el tiempo','Líneas','Paneles chicos, series indexadas'],
   ['Partes de un total en el tiempo','Área apilada','Líneas de participación, paneles chicos'],
   ['Dos momentos, muchas categorías','Dumbbell, slopegraph','Barras de cambio ordenadas'],
   ['Brechas entre grupos','Dot plot de brechas, barras de desvío','Paneles chicos ordenados por brecha'],
   ['Cualquiera de las anteriores, por grupo','Paneles chicos (small multiples) con escala común','Resaltar una serie sobre el resto en gris']
  ].forEach(r=>h.push('<tr><td class="t">'+r[0]+'</td><td class="t">'+r[1]+'</td><td class="t">'+r[2]+'</td></tr>'));
  h.push('</tbody></table></div></div>');

  FAMS.forEach(fam=>{
    h.push('<div><h3>'+fam+'</h3><div class="cards">');
    CHARTS.filter(c=>c.fam===fam).forEach(c=>{
      const m=METHOD[c.id]||{};
      h.push('<div class="card"><h4>'+c.name+'</h4><dl>',
        '<div><dt>Para qué sirve</dt><dd>'+(m.use||'')+'</dd></div>',
        '<div><dt>Qué se puede leer</dt><dd>'+(m.read||'')+'</dd></div>',
        '<div><dt>Qué puede fallar</dt><dd class="prob">'+(m.prob||'')+'</dd></div>',
        '<div><dt>Alternativas</dt><dd>'+(m.alt||'')+'</dd></div>',
        '</dl></div>');
    });
    h.push('</div></div>');
  });

  h.push('<div><h3>Errores y advertencias generales</h3><div class="caveats">');
  CAVEATS.forEach(c=>h.push('<div class="cav"><b>'+c[0]+'</b><p>'+c[1]+'</p></div>'));
  h.push('</div></div>');

  h.push('<div><h3>Las paletas de esta página</h3><div class="tablewrap"><table><thead><tr><th>Paleta</th><th>Tipo</th><th>Cuándo usarla</th><th>Vista</th></tr></thead><tbody>');
  const KINDES={cat:'Categórica',seq:'Secuencial',div:'Divergente'};
  const WHEN={cat:'Identidad sin orden: regiones, países. Nunca para magnitud.',
    seq:'Magnitud ordenada de menor a mayor: mapas de calor, intensidades.',
    div:'Variables con un punto neutro con significado: correlaciones, desvíos respecto de un promedio, crecimiento positivo o negativo.'};
  Object.keys(PAL).forEach(p=>{
    const o=PAL[p];
    h.push('<tr><td class="t">'+o.lab+'</td><td class="t">'+KINDES[o.kind]+'</td><td class="t">'+(o.bad?'Nunca. Está incluida para poder compararla con Viridis en un mapa de calor.':WHEN[o.kind])+'</td>'+
      '<td><div style="width:120px;height:12px;border-radius:2px;background:linear-gradient(to right,'+o.c.join(',')+')"></div></td></tr>');
  });
  h.push('</tbody></table></div></div>');

  h.push('<div><h3>Qué hace esta página con los datos</h3><div class="caveats">',
   '<div class="cav"><b>Unidad de observación</b><p>Cada caso es un país en un año. Los agregados regionales del Banco Mundial están excluidos, igual que los países con menos de 500.000 habitantes. Quedan 172 países.</p></div>',
   '<div class="cav"><b>Agregación</b><p>Cuando se agrupa (por región, por grupo de ingreso, por tercil), el valor del grupo se calcula con la función que elijas: promedio simple, promedio ponderado por población, mediana, suma, percentiles o desvío. La elección cambia el resultado, y es parte de lo que hay que discutir.</p></div>',
   '<div class="cav"><b>Terciles</b><p>Las opciones «(terciles)» convierten una variable cuantitativa en tres categorías ordenadas calculadas sobre los países que quedan después de los filtros. Si cambiás el año o los filtros, los cortes se recalculan.</p></div>',
   '<div class="cav"><b>Datos faltantes</b><p>Nunca se interpolan ni se rellenan. Los países sin dato se excluyen del gráfico y la cantidad se informa como aviso. En las series de tiempo, los tramos sin dato quedan interrumpidos.</p></div>',
   '<div class="cav"><b>Grupo de ingreso</b><p>Es la clasificación vigente del Banco Mundial, fija en el tiempo: no refleja los cambios de categoría de cada país a lo largo del período.</p></div>',
   '<div class="cav"><b>Lo que esta página no hace</b><p>No interpreta los datos ni sugiere conclusiones. Los avisos amarillos son sobre la construcción del gráfico (ejes, paletas, agregación, faltantes), no sobre qué significan los números. Esa lectura es el trabajo de quien usa la herramienta.</p></div>',
   '</div></div>');
  document.getElementById('pane-metodologia').innerHTML=h.join('');
}

/* ══════════════ 22. PESTAÑA DE VARIABLES Y FUENTES ══════════════ */
function renderSources(){
  const h=[];
  h.push('<div><h2>Variables y fuentes</h2>',
   '<p class="lede">Todos los datos provienen de los <i>World Development Indicators</i> del Banco Mundial, descargados de su API pública. ',
   'Cada variable conserva el código original del indicador para que puedas rastrearla, replicarla o traerla a R o Python con <code>wbstats</code>, <code>WDI</code> o <code>pandas-datareader</code>.</p></div>');
  h.push('<div><h3>Variables cuantitativas</h3><div class="tablewrap"><table><thead><tr><th>Variable</th><th>Unidad</th><th>Código WDI</th><th>Países con dato (último año)</th><th>Escala log sugerida</th></tr></thead><tbody>');
  NUMKEYS.forEach(k=>{
    const n=RAW.countries.filter(c=>c[k].some(v=>v!=null)).length;
    const last=RAW.countries.filter(c=>c[k][c[k].length-1]!=null).length;
    h.push('<tr><td class="t">'+NUMV[k].lab+'</td><td class="t">'+NUMV[k].unit+'</td><td>'+NUMV[k].code+'</td><td class="num">'+last+' de '+n+'</td><td class="t">'+(NUMV[k].log?'Sí':'No')+'</td></tr>');
  });
  h.push('</tbody></table></div></div>');
  h.push('<div><h3>Variables cualitativas</h3><div class="tablewrap"><table><thead><tr><th>Variable</th><th>Categorías</th><th>¿Tiene orden?</th></tr></thead><tbody>',
   '<tr><td class="t">Región</td><td class="num">7</td><td class="t">No — pide paleta categórica</td></tr>',
   '<tr><td class="t">Grupo de ingreso</td><td class="num">4</td><td class="t">Sí — admite paleta secuencial</td></tr>',
   '<tr><td class="t">País</td><td class="num">172</td><td class="t">No — demasiadas categorías para el color</td></tr>',
   '<tr><td class="t">Terciles de cualquier cuantitativa</td><td class="num">3</td><td class="t">Sí — admite paleta secuencial</td></tr>',
   '</tbody></table></div></div>');
